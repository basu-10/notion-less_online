plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.notionless.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.notionless.app'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.0.1'
    }

    // Release signing: passwords live in ~/.keystores/notionless.properties
    // (outside the repo, never committed) or in NOTIONLESS_* env vars.
    signingConfigs {
        release {
            def propsFile = new File(System.getProperty('user.home'), '.keystores/notionless.properties')
            def props = new Properties()
            if (propsFile.exists()) {
                propsFile.withInputStream { props.load(it) }
            }
            storeFile = file(props.getProperty('storeFile', System.getenv('NOTIONLESS_KEYSTORE') ?: (System.getProperty('user.home') + '/.keystores/notionless-release.jks')))
            storePassword = props.getProperty('storePassword', System.getenv('NOTIONLESS_STORE_PASS'))
            keyAlias = props.getProperty('keyAlias', System.getenv('NOTIONLESS_KEY_ALIAS') ?: 'notionless')
            keyPassword = props.getProperty('keyPassword', System.getenv('NOTIONLESS_KEY_PASS'))
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        buildConfig = true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.webkit:webkit:1.10.0'
}
