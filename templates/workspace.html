<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#d85b45">
  <meta name="description" content="A lightweight, block-based note-taking workspace">
  <title>NotionLess Cloud</title>

  <link rel="preconnect" href="https://esm.sh">
  <link rel="stylesheet" href="https://esm.sh/@blocknote/core@0.51.3/style.css">
  <link rel="stylesheet" href="https://esm.sh/@blocknote/core@0.51.3/fonts/inter.css">

  <link rel="stylesheet" href="/static/css/theme.css">
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brandbar">
        <a href="/" class="brand"><div class="brand-mark">NL</div><span>NotionLess</span></a>
      </div>
      <div class="sidebar-section">
        <span>Your Pages</span>
        <div class="section-actions">
          <button class="section-action" id="newPageBtn" title="New page">＋</button>
          <button class="section-action" id="collapseAll" title="Collapse all">▾</button>
        </div>
      </div>
      <div id="pageTree"></div>
      <div class="sidebar-footer">
        <button class="sidebar-menu-btn" id="sidebarMenuBtn" aria-label="User menu">
          <span class="user-avatar">U</span>
          <span class="user-name" id="userName">User</span>
          <span class="user-menu-arrow">▾</span>
        </button>
        <div class="sidebar-user-menu" id="sidebarUserMenu">
          <button class="user-menu-item" id="footerSettingsBtn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            Settings
          </button>
          <button class="user-menu-item" id="footerExportBtn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Export profile
          </button>
          <div class="user-menu-divider"></div>
          <a href="/auth/logout" class="user-menu-item user-menu-danger">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Log out
          </a>
        </div>
        <div class="sidebar-save-state">
          <button class="notification-trigger" id="notificationTrigger" aria-label="View notifications">
            <span id="saveState">Ready</span>
          </button>
          <div id="notificationPanel" class="notification-panel" role="dialog" aria-label="Notifications">
            <div class="notification-header">
              <span>Notifications</span>
              <button class="icon-btn" id="clearNotifications" title="Clear all">✕</button>
            </div>
            <div class="notification-list" id="notificationList"></div>
          </div>
        </div>
      </div>
    </aside>

    <div class="sidebar-resize-handle" id="sidebarResizeHandle" title="Drag to resize sidebar"></div>

    <main class="main">
      <div class="topbar">
        <div class="breadcrumbs" id="breadcrumbs"></div>
        <div class="top-actions">
          <button class="icon-btn mobile-menu-btn" id="mobileMenuBtn" title="Menu" aria-label="Open menu">☰</button>
          <button class="top-action primary" id="saveBtn" style="display:none;">Save</button>
          <button class="icon-btn" id="undoBtn" title="Undo (Ctrl+Z)">↩</button>
          <button class="icon-btn" id="redoBtn" title="Redo (Ctrl+Shift+Z)">↪</button>
        </div>
      </div>

      <div class="workspace" id="workspace">
        <article class="document">
          <input id="pageTitle" class="page-title" placeholder="Untitled" autocomplete="off" spellcheck="true">
          <div id="editor"></div>
          <div class="hint">Type <strong>/</strong> for blocks. Press Tab / Shift+Tab to nest or unnest blocks.</div>
        </article>
      </div>
    </main>
  </div>

  <div id="mobileBackdrop" class="mobile-backdrop" aria-hidden="true"></div>
  <div id="slashMenu" role="menu" aria-label="Block commands"></div>
  <div id="contextMenu" role="menu" aria-label="Page actions"></div>
  <div id="blockMenu" class="block-menu" role="menu" aria-label="Block options"></div>
  <div id="formatToolbar" class="format-toolbar" role="toolbar" aria-label="Formatting"></div>

  <aside id="settingsPanel" class="settings-panel" aria-label="Settings">
    <div class="settings-header">
      <h2>Settings</h2>
      <button class="icon-btn" id="closeSettings" title="Close">✕</button>
    </div>
    <div class="settings-section">
      <h3>Theme</h3>
      <div class="theme-options">
        <button class="theme-btn active" data-theme="light">Light</button>
        <button class="theme-btn" data-theme="dark">Dark</button>
        <button class="theme-btn" data-theme="auto">Follow system</button>
      </div>
    </div>
    <div class="settings-section">
      <h3>Export / Import</h3>
      <div class="export-grid">
        <button class="action-btn" id="exportProfile">Export whole profile</button>
        <button class="action-btn" id="importProfile">Import profile</button>
        <button class="action-btn" id="exportNote">Export current note</button>
      </div>
      <input type="file" id="importFile" accept=".json" style="display:none;" />
    </div>
  </aside>

  <script src="/static/js/api-client.js"></script>
  <script src="/static/js/notifications.js"></script>
  <script type="module" src="/static/js/app-module.js"></script>
</body>
</html>
