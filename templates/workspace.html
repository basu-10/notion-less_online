<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#d85b45">
  <meta name="description" content="A lightweight, block-based note-taking workspace powered by NotionLess Cloud.">
  <title>NotionLess Cloud</title>

  <link rel="preconnect" href="https://esm.sh">
  <link rel="stylesheet" href="https://esm.sh/@blocknote/core@0.51.3/style.css">
  <link rel="stylesheet" href="https://esm.sh/@blocknote/core@0.51.3/fonts/inter.css">

  <link rel="stylesheet" href="/static/css/theme.css">
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="Sidebar navigation">
      <div class="brandbar">
        <a href="/" class="brand" aria-label="NotionLess home">
          <div class="brand-mark" aria-hidden="true">NL</div>
          <span>NotionLess</span>
        </a>
      </div>

      <nav class="sidebar-section" aria-label="Pages section">
        <span>Your Pages</span>
        <div class="section-actions" aria-label="Page actions">
          <button class="section-action" id="newPageBtn" title="New page" aria-label="Create new page">+</button>
          <button class="section-action" id="collapseAll" title="Collapse all" aria-label="Collapse or expand all">▾</button>
        </div>
      </nav>

      <div id="pageTree" aria-label="Page tree"></div>

      <footer class="sidebar-footer" aria-label="User menu and status">
        <button class="sidebar-menu-btn" id="sidebarMenuBtn" aria-label="Open user menu" aria-expanded="false" aria-haspopup="true">
          <span class="user-avatar" aria-hidden="true">U</span>
          <span class="user-name" id="userName">User</span>
          <span class="user-menu-arrow" aria-hidden="true">▾</span>
        </button>

        <div class="sidebar-user-menu" id="sidebarUserMenu" role="menu" aria-label="User options" aria-hidden="true">
          <button class="user-menu-item" id="footerSettingsBtn" role="menuitem">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            Settings
          </button>
          <button class="user-menu-item" id="footerExportBtn" role="menuitem">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Export profile
          </button>
          <div class="user-menu-divider" aria-hidden="true"></div>
          <a href="/auth/logout" class="user-menu-item user-menu-danger" role="menuitem">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Log out
          </a>
        </div>

        <div class="sidebar-save-state" aria-label="Save status">
          <button class="notification-trigger" id="notificationTrigger" aria-label="View notifications" aria-haspopup="true" aria-expanded="false">
            <span id="saveState">Ready</span>
          </button>
          <div id="notificationPanel" class="notification-panel" role="dialog" aria-label="Notifications" aria-modal="true" aria-hidden="true">
            <div class="notification-header">
              <span>Notifications</span>
            </div>
            <div class="notification-list" id="notificationList" aria-live="polite"></div>
            <div class="notification-footer">
              <button class="icon-btn clear-btn" id="clearNotifications" title="Clear all" aria-label="Clear notifications">🗑</button>
            </div>
          </div>
        </div>
      </footer>
    </aside>

    <div class="sidebar-resize-handle" id="sidebarResizeHandle" title="Drag to resize sidebar" aria-label="Resize sidebar" aria-orientation="horizontal"></div>

    <main class="main" aria-label="Main workspace">
      <header class="topbar" aria-label="Top toolbar">
        <nav class="breadcrumbs" id="breadcrumbs" aria-label="Breadcrumb navigation"></nav>
        <div class="top-actions" aria-label="Workspace actions">
          <button class="icon-btn mobile-menu-btn" id="mobileMenuBtn" title="Menu" aria-label="Open sidebar menu" aria-expanded="false" aria-controls="sidebar">☰</button>
          <button class="top-action primary" id="saveBtn" style="display:none;" aria-label="Save current page">Save</button>
          <button class="icon-btn" id="undoBtn" title="Undo (Ctrl+Z)" aria-label="Undo">↩</button>
          <button class="icon-btn" id="redoBtn" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">↪</button>
        </div>
      </header>

      <div class="workspace" id="workspace" aria-label="Document workspace">
        <article class="document" aria-label="Document editor">
          <header class="document-header">
            <input id="pageTitle" class="page-title" placeholder="Untitled" autocomplete="off" spellcheck="true" aria-label="Page title">
          </header>
          <div id="editor" aria-label="BlockNote editor"></div>
          <p class="hint" aria-label="Editor hint">Type <strong>/</strong> for blocks. Press <kbd>Tab</kbd> / <kbd>Shift+Tab</kbd> to nest or unnest blocks.</p>
        </article>
      </div>
    </main>
  </div>

  <div id="mobileBackdrop" class="mobile-backdrop" aria-hidden="true" aria-label="Mobile overlay"></div>

  <div id="slashMenu" role="menu" aria-label="Block commands" aria-hidden="true"></div>
  <div id="contextMenu" role="menu" aria-label="Page actions" aria-hidden="true"></div>
  <div id="blockMenu" class="block-menu" role="menu" aria-label="Block options" aria-hidden="true"></div>
  <div id="formatToolbar" class="format-toolbar" role="toolbar" aria-label="Formatting" aria-hidden="true"></div>

  <aside id="settingsPanel" class="settings-panel" aria-label="Settings panel" aria-hidden="true">
    <header class="settings-header">
      <h2>Settings</h2>
      <button class="icon-btn" id="closeSettings" title="Close" aria-label="Close settings panel">✕</button>
    </header>
    <section class="settings-section" aria-label="Theme settings">
      <h3>Theme</h3>
      <div class="theme-options" role="radiogroup" aria-label="Theme selection">
        <button class="theme-btn active" data-theme="light" role="radio" aria-checked="true" aria-label="Light theme">Light</button>
        <button class="theme-btn" data-theme="dark" role="radio" aria-checked="false" aria-label="Dark theme">Dark</button>
        <button class="theme-btn" data-theme="auto" role="radio" aria-checked="false" aria-label="Auto theme">Follow system</button>
      </div>
    </section>
    <section class="settings-section" aria-label="Export and import">
      <h3>Export / Import</h3>
      <div class="export-grid" aria-label="Export actions">
        <button class="action-btn" id="exportProfile" aria-label="Export whole profile">Export whole profile</button>
        <button class="action-btn" id="importProfile" aria-label="Import profile">Import profile</button>
        <button class="action-btn" id="exportNote" aria-label="Export current note">Export current note</button>
      </div>
      <input type="file" id="importFile" accept=".json" style="display:none;" aria-hidden="true" />
    </section>
  </aside>

  <script src="/static/js/api-client.js"></script>
  <script src="/static/js/notifications.js"></script>
  <script type="module" src="/static/js/app-module.js"></script>
</body>
</html>
