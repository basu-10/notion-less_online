<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#d9a400">
  <meta name="description" content="NotionLess public feed — newest community posts first.">
  <title>Feed — NotionLess</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="preconnect" href="https://esm.sh">
  <script>
    (function() {
      var t;
      try { t = localStorage.getItem("notion-theme"); } catch(e) {}
      var theme = (t === "dark" || t === "light") ? t : (
        window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
      );
      if (theme === "dark") { document.documentElement.setAttribute("data-theme", "dark"); }
    })();
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f5f5f7;
      --surface: #ffffff;
      --border: rgba(0, 0, 0, 0.08);
      --border-subtle: rgba(0, 0, 0, 0.04);
      --text: #1d1d1f;
      --text-secondary: #515154;
      --muted: #86868b;
      --hover: rgba(0, 0, 0, 0.04);
      --accent: #d9a400;
      --accent-light: #eab800;
      --accent-ink: #7a5c00;
      --accent-soft: rgba(217, 164, 0, 0.08);
      --accent-wash: rgba(217, 164, 0, 0.12);
      --header-bg: rgba(245, 245, 247, 0.72);
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
      --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.06);
    }
    [data-theme="dark"] {
      --bg: #000000;
      --surface: #1d1d1f;
      --border: rgba(255, 255, 255, 0.12);
      --border-subtle: rgba(255, 255, 255, 0.06);
      --text: #f5f5f7;
      --text-secondary: #a1a1a6;
      --muted: #86868b;
      --hover: rgba(255, 255, 255, 0.06);
      --accent: #d9a400;
      --accent-light: #eab800;
      --accent-ink: #eab800;
      --accent-soft: rgba(217, 164, 0, 0.14);
      --accent-wash: rgba(217, 164, 0, 0.22);
      --header-bg: rgba(0, 0, 0, 0.72);
    }
    html { scroll-behavior: smooth; }
    html, body { height: auto; overflow-x: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, Inter, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      letter-spacing: -0.01em;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; letter-spacing: -0.02em; color: var(--text); text-decoration: none; }
    .brand-mark { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 7px; background: #1d1d1f; font-weight: 700; font-size: 11px; letter-spacing: -0.04em; color: #d9a400; flex-shrink: 0; }
    .site-header { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: var(--header-bg); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); border-bottom: 1px solid var(--border-subtle); }
    .site-header .container { display: flex; align-items: center; gap: 16px; height: 52px; max-width: 980px; margin: 0 auto; padding: 0 20px; }
    .header-nav { display: flex; align-items: center; gap: 20px; margin-left: 8px; }
    .header-nav a { color: var(--text-secondary); text-decoration: none; font-size: 13px; transition: color 0.12s ease; }
    .header-nav a:hover, .header-nav a.active { color: var(--accent-ink); }
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 18px; border-radius: 980px; font-size: 13px; font-weight: 500; text-decoration: none; transition: background 0.12s ease; cursor: pointer; border: none; }
    .btn-primary { background: var(--accent); color: #1a1a18; }
    .btn-primary:hover { background: var(--accent-light); }
    .btn-secondary { background: var(--hover); color: var(--accent-ink); }
    .btn-secondary:hover { background: var(--accent-soft); }
    .header-theme-wrapper { position: relative; margin-left: auto; }
    .header-theme { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 980px; border: none; background: var(--hover); color: var(--text-secondary); font-size: 13px; font-family: inherit; cursor: pointer; }
    .header-theme:hover { background: var(--accent-soft); color: var(--text); }
    .header-theme-menu { position: absolute; top: calc(100% + 6px); right: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 5px; min-width: 160px; box-shadow: 0 8px 30px rgba(0,0,0,0.12); z-index: 110; opacity: 0; pointer-events: none; transform: translateY(-4px); transition: opacity 0.15s ease, transform 0.15s ease; }
    .header-theme-menu.open { opacity: 1; pointer-events: auto; transform: translateY(0); }
    .header-theme-menu button { width: 100%; text-align: left; padding: 7px 10px; border-radius: 7px; border: none; background: transparent; color: var(--text); font-family: inherit; font-size: 13px; cursor: pointer; }
    .header-theme-menu button:hover { background: var(--hover); }
    .mobile-nav-toggle { display: none; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; }
    .mobile-nav-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 200; opacity: 0; transition: opacity .25s ease; }
    .mobile-nav-overlay.open { opacity: 1; }
    .mobile-nav-panel { position: fixed; top: 0; left: 0; bottom: 0; width: 280px; background: var(--surface); border-right: 1px solid var(--border); z-index: 201; transform: translateX(-100%); transition: transform .25s ease; padding: 24px; display: flex; flex-direction: column; }
    .mobile-nav-panel.open { transform: translateX(0); }
    .mobile-nav-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .mobile-nav-close { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; }
    .mobile-nav-divider { height: 1px; background: var(--border); margin: 8px 0; }
    .mobile-nav-panel .nav-link { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 8px; color: var(--text); text-decoration: none; font-weight: 500; }
    .mobile-nav-panel .nav-link:hover { background: var(--hover); }
    .mobile-nav-panel .nav-link.active { color: var(--accent-ink); }

    .feed-container { max-width: 680px; margin: 0 auto; padding: 96px 20px 64px; }
    .feed-hero { margin-bottom: 22px; }
    .feed-label {
      display: inline-flex; align-items: center; gap: 7px;
      font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--accent-ink); margin-bottom: 10px;
    }
    .feed-label .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
    .feed-hero h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.022em; line-height: 1.12; margin-bottom: 6px; }
    .feed-hero p { color: var(--muted); font-size: 15px; }
    .feed-controls { display: flex; align-items: center; gap: 10px; margin: 18px 0 16px; }
    .feed-count {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 13px; font-weight: 500; color: var(--text-secondary);
      background: var(--surface); border: 1px solid var(--border-subtle);
      border-radius: 980px; padding: 6px 14px;
    }
    .feed-count .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
    .refresh-btn {
      margin-left: auto; display: inline-flex; align-items: center; gap: 7px;
      padding: 7px 15px; border-radius: 980px; border: 1px solid var(--border-subtle);
      background: var(--surface); color: var(--text-secondary);
      font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer;
      transition: background 0.12s ease, color 0.12s ease;
    }
    .refresh-btn:hover { background: var(--accent-soft); color: var(--text); }
    .refresh-btn:disabled { opacity: 0.6; cursor: default; }
    .refresh-btn svg.spin { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .feed-list { display: flex; flex-direction: column; gap: 12px; }
    .feed-card {
      display: block; text-decoration: none; color: inherit;
      background: var(--surface); border: 1px solid var(--border-subtle);
      border-radius: 16px; padding: 18px 18px 15px;
      transition: box-shadow 0.15s ease, transform 0.15s ease;
      position: relative; overflow: hidden;
    }
    .feed-card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
    .feed-card.fresh::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, var(--accent) 0%, var(--accent-light) 55%, transparent 100%);
    }
    .feed-author { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .feed-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; flex-shrink: 0; background: linear-gradient(180deg, #6e6e73 0%, #48484a 100%); display: grid; place-items: center; font-size: 14px; font-weight: 600; color: #fff; }
    .feed-author-meta { flex: 1; min-width: 0; line-height: 1.3; }
    .feed-author-name { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .feed-author-name a { color: inherit; text-decoration: none; }
    .feed-author-name a:hover { color: var(--accent-ink); }
    .feed-time { font-size: 12.5px; color: var(--muted); }
    .fresh-badge {
      font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--accent-ink); background: var(--accent-soft);
      border-radius: 980px; padding: 3px 9px; flex-shrink: 0;
    }
    .feed-title { font-size: 18px; font-weight: 700; letter-spacing: -0.015em; line-height: 1.3; margin-bottom: 6px; }
    .feed-excerpt { font-size: 14px; color: var(--text-secondary); line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .feed-cover { margin-top: 12px; border-radius: 10px; overflow: hidden; border: 1px solid var(--border-subtle); background: var(--hover); }
    .feed-cover img { display: block; width: 100%; max-height: 260px; object-fit: cover; }
    .feed-footer { display: flex; align-items: center; gap: 12px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border-subtle); font-size: 13px; color: var(--muted); }
    .feed-footer .read { margin-left: auto; font-weight: 600; color: var(--accent-ink); }
    .skeleton {
      background: var(--surface); border: 1px solid var(--border-subtle); border-radius: 16px;
      padding: 18px; display: flex; flex-direction: column; gap: 10px;
    }
    .sk { border-radius: 6px; background: var(--hover); animation: shimmer 1.2s ease-in-out infinite alternate; }
    @keyframes shimmer { from { opacity: 0.6; } to { opacity: 1; } }
    .feed-empty, .feed-error {
      text-align: center; padding: 56px 24px; color: var(--muted); font-size: 14px;
      background: var(--surface); border: 1px dashed var(--border); border-radius: 16px;
    }
    .feed-empty .big, .feed-error .big { font-size: 40px; margin-bottom: 12px; }
    .feed-empty h2, .feed-error h2 { color: var(--text); font-size: 18px; font-weight: 700; margin-bottom: 6px; }
    .feed-empty a, .feed-error a { color: var(--accent-ink); text-decoration: none; font-weight: 600; }
    .load-more-wrap { display: flex; justify-content: center; margin-top: 20px; }
    .sentinel { height: 1px; }
    @media (max-width: 768px) {
      .feed-container { padding: 76px 16px 48px; }
      .feed-hero h1 { font-size: 24px; }
      .feed-card { padding: 15px 15px 13px; border-radius: 14px; }
      .feed-title { font-size: 16.5px; }
      .header-nav { display: none; }
      .mobile-nav-toggle { display: flex; }
      .site-header .container { padding: 0 16px; gap: 10px; }
    }
  </style>
</head>
<body>
  {% include 'components/navbar.html' %}
  <main class="feed-container">
    <div class="feed-hero">
      <span class="feed-label"><span class="pulse"></span>Public feed</span>
      <h1>Fresh from the community</h1>
      <p>Newest public posts first &middot; sorted by publish date</p>
    </div>
    <div class="feed-controls">
      <span class="feed-count"><span class="dot"></span><span id="feedCount">Loading…</span></span>
      <button class="refresh-btn" id="refreshBtn" type="button" aria-label="Refresh feed">
        <svg id="refreshIcon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        Refresh
      </button>
    </div>
    <div class="feed-list" id="feedList" aria-live="polite"></div>
    <div class="load-more-wrap" id="loadMoreWrap" style="display:none;">
      <button class="btn btn-secondary" id="loadMoreBtn" type="button">Load more</button>
    </div>
    <div class="sentinel" id="sentinel"></div>
  </main>

  <script>
    const feedList = document.getElementById('feedList');
    const feedCount = document.getElementById('feedCount');
    const loadMoreWrap = document.getElementById('loadMoreWrap');
    const loadMoreBtn = document.getElementById('loadMoreBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const refreshIcon = document.getElementById('refreshIcon');
    const PAGE_SIZE = 20;
    let offset = 0, total = 0, loading = false, exhausted = false;

    function escapeHtml(text) {
      if (text == null) return '';
      const div = document.createElement('div');
      div.textContent = String(text);
      return div.innerHTML;
    }

    function timeAgo(ts) {
      if (!ts) return 'recently';
      const sec = Date.now() / 1000 - Number(ts);
      if (sec < 0) return 'just now';
      if (sec < 60) return 'just now';
      if (sec < 3600) { const m = Math.floor(sec / 60); return m + ' min ago'; }
      if (sec < 86400) { const h = Math.floor(sec / 3600); return h + (h === 1 ? ' hour ago' : ' hours ago'); }
      if (sec < 86400 * 7) { const d = Math.floor(sec / 86400); return d + (d === 1 ? ' day ago' : ' days ago'); }
      const d = new Date(Number(ts) * 1000);
      return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function isFresh(ts) {
      if (!ts) return false;
      return (Date.now() / 1000 - Number(ts)) < 86400;
    }

    function showSkeletons() {
      feedList.innerHTML = Array.from({ length: 4 }).map(() => `
        <div class="skeleton" aria-hidden="true">
          <div style="display:flex;gap:10px;align-items:center;">
            <div class="sk" style="width:36px;height:36px;border-radius:50%;"></div>
            <div style="flex:1;"><div class="sk" style="height:10px;width:40%;margin-bottom:6px;"></div><div class="sk" style="height:9px;width:25%;"></div></div>
          </div>
          <div class="sk" style="height:16px;width:70%;"></div>
          <div class="sk" style="height:10px;width:100%;"></div>
          <div class="sk" style="height:10px;width:85%;"></div>
        </div>`).join('');
    }

    function cardHtml(post) {
      const pub = post.published_at || post.updated_at || post.created_at;
      const fresh = isFresh(pub) ? '<span class="fresh-badge">Fresh</span>' : '';
      const avatar = post.author_avatar_url
        ? `<img class="feed-avatar" src="${escapeHtml(post.author_avatar_url)}" alt="" loading="lazy" onerror="this.outerHTML='<div class=feed-avatar>${escapeHtml((post.author_display_name || post.author || '?').charAt(0).toUpperCase())}</div>'">`
        : `<div class="feed-avatar">${escapeHtml((post.author_display_name || post.author || '?').charAt(0).toUpperCase())}</div>`;
      const sub = (post.subpage_count > 0) ? `<span>${post.subpage_count} subpage${post.subpage_count === 1 ? '' : 's'}</span>` : '<span>Post</span>';
      const cover = post.image
        ? `<div class="feed-cover"><img src="${escapeHtml(post.image)}" alt="" loading="lazy" onerror="this.closest('.feed-cover').remove()"></div>` : '';
      const excerpt = post.excerpt ? `<p class="feed-excerpt">${escapeHtml(post.excerpt)}</p>` : '';
      return `
      <a class="feed-card${isFresh(pub) ? ' fresh' : ''}" href="/p/${encodeURIComponent(post.author)}/${encodeURIComponent(post.id)}">
        <div class="feed-author">
          ${avatar}
          <div class="feed-author-meta">
            <div class="feed-author-name">${escapeHtml(post.author_display_name || post.author)}</div>
            <div class="feed-time">@${escapeHtml(post.author)} &middot; ${escapeHtml(timeAgo(pub))}</div>
          </div>
          ${fresh}
        </div>
        <h2 class="feed-title">${escapeHtml(post.title || 'Untitled')}</h2>
        ${excerpt}
        ${cover}
        <div class="feed-footer">${sub}<span class="read">Read &rarr;</span></div>
      </a>`;
    }

    async function loadMore(reset) {
      if (loading || (exhausted && !reset)) return;
      loading = true;
      loadMoreBtn.textContent = 'Loading…';
      refreshIcon.classList.add('spin');
      refreshBtn.disabled = true;
      if (reset) { offset = 0; exhausted = false; showSkeletons(); loadMoreWrap.style.display = 'none'; }
      try {
        const res = await fetch(`/api/feed?limit=${PAGE_SIZE}&offset=${offset}`);
        if (!res.ok) throw new Error('feed failed');
        const data = await res.json();
        const posts = data.posts || [];
        total = data.total || 0;
        if (reset) feedList.innerHTML = '';
        if (reset && posts.length === 0) {
          feedList.innerHTML = `
            <div class="feed-empty">
              <div class="big">📭</div>
              <h2>No public posts yet</h2>
              <p>Be the first to share — publish a page from your <a href="/app">workspace</a>.</p>
            </div>`;
        } else {
          feedList.insertAdjacentHTML('beforeend', posts.map(cardHtml).join(''));
        }
        offset += posts.length;
        exhausted = !data.has_more;
        feedCount.textContent = total === 0 ? 'No posts yet' : `${total} public post${total === 1 ? '' : 's'}`;
        loadMoreWrap.style.display = (!exhausted && total > 0) ? 'flex' : 'none';
        loadMoreBtn.textContent = 'Load more';
      } catch (e) {
        if (reset) {
          feedList.innerHTML = `
            <div class="feed-error">
              <div class="big">⚠️</div>
              <h2>Couldn't load the feed</h2>
              <p>Please check your connection and <a href="/feed">try again</a>.</p>
            </div>`;
          feedCount.textContent = 'Feed unavailable';
        }
      } finally {
        loading = false;
        refreshIcon.classList.remove('spin');
        refreshBtn.disabled = false;
      }
    }

    loadMoreBtn.addEventListener('click', () => loadMore(false));
    refreshBtn.addEventListener('click', () => loadMore(true));

    const sentinel = document.getElementById('sentinel');
    if ('IntersectionObserver' in window) {
      new IntersectionObserver((entries) => {
        if (entries.some(e => e.isIntersecting)) loadMore(false);
      }, { rootMargin: '600px' }).observe(sentinel);
    }

    loadMore(true);
  </script>

  <script src="/static/js/theme.js"></script>
  <script>
    const themeBtn = document.getElementById('headerThemeBtn');
    const themeMenu = document.getElementById('headerThemeMenu');
    const themeLabel = document.getElementById('themeLabel');
    const themeIconLight = document.getElementById('themeIconLight');
    const themeIconDark = document.getElementById('themeIconDark');
    const themeIconAuto = document.getElementById('themeIconAuto');
    function updateThemeIcon(mode) {
      themeIconLight.style.display = mode === 'light' ? 'block' : 'none';
      themeIconDark.style.display = mode === 'dark' ? 'block' : 'none';
      themeIconAuto.style.display = mode === 'auto' ? 'block' : 'none';
      themeLabel.textContent = mode === 'light' ? 'Light' : mode === 'dark' ? 'Dark' : 'Auto';
    }
    themeBtn.addEventListener('click', (e) => { e.stopPropagation(); themeMenu.classList.toggle('open'); });
    document.addEventListener('click', () => themeMenu.classList.remove('open'));
    document.querySelectorAll('.header-theme-menu .theme-btn').forEach(b => {
      b.addEventListener('click', () => { applyTheme(b.dataset.theme); updateThemeIcon(b.dataset.theme); themeMenu.classList.remove('open'); });
    });
    updateThemeIcon(getTheme());
  </script>
  <script>
    const mobileNavToggle = document.getElementById('mobileNavToggle');
    const mobileNavOverlay = document.getElementById('mobileNavOverlay');
    const mobileNavPanel = document.getElementById('mobileNavPanel');
    const mobileNavClose = document.getElementById('mobileNavClose');
    function openMobileNav() { mobileNavOverlay.classList.add('open'); mobileNavPanel.classList.add('open'); document.body.style.overflow = 'hidden'; }
    function closeMobileNav() { mobileNavOverlay.classList.remove('open'); mobileNavPanel.classList.remove('open'); document.body.style.overflow = ''; }
    mobileNavToggle.addEventListener('click', openMobileNav);
    mobileNavOverlay.addEventListener('click', closeMobileNav);
    mobileNavClose.addEventListener('click', closeMobileNav);
  </script>
</body>
</html>
