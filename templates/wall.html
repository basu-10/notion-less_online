<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>{{ username }}'s Wall — NotionLess</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="preconnect" href="https://esm.sh">
  <link rel="stylesheet" href="/static/css/theme.css">
  <link rel="stylesheet" href="/static/css/auth.css">
  <script>
    (function() {
      var t;
      try { t = localStorage.getItem("notion-theme"); } catch(e) {}
      var theme = (t === "dark" || t === "light") ? t : (
        window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
      );
      if (theme === "dark") { document.documentElement.setAttribute("data-theme", "dark"); }
    })();
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    :root {
      --bg: #f5f5f7;
      --surface: #ffffff;
      --border: rgba(0, 0, 0, 0.08);
      --border-subtle: rgba(0, 0, 0, 0.04);
      --text: #1d1d1f;
      --text-secondary: #515154;
      --muted: #86868b;
      --hover: rgba(0, 0, 0, 0.04);
      --accent: #0071e3;
      --accent-deep: #0068d1;
      --accent-soft: rgba(0, 113, 227, 0.08);
      --accent-wash: rgba(0, 113, 227, 0.14);
      --danger: #d70015;
      --header-bg: rgba(245, 245, 247, 0.72);
    }
    [data-theme="dark"] {
      --bg: #000000;
      --surface: #1d1d1f;
      --border: rgba(255, 255, 255, 0.12);
      --border-subtle: rgba(255, 255, 255, 0.06);
      --text: #f5f5f7;
      --text-secondary: #a1a1a6;
      --muted: #86868b;
      --hover: rgba(255, 255, 255, 0.06);
      --accent: #0a84ff;
      --accent-deep: #409cff;
      --accent-soft: rgba(10, 132, 255, 0.14);
      --accent-wash: rgba(10, 132, 255, 0.22);
      --danger: #ff453a;
      --header-bg: rgba(0, 0, 0, 0.72);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, Inter, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      letter-spacing: -0.01em;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; letter-spacing: -0.02em; color: var(--text); text-decoration: none; }
    .brand-mark { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 7px; background: #1d1d1f; font-weight: 700; font-size: 11px; letter-spacing: -0.04em; color: #d9a400; flex-shrink: 0; }
    [data-theme="dark"] .brand-mark { background: #f5f5f7; color: #b89400; }
    header { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: var(--header-bg); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); border-bottom: 1px solid var(--border-subtle); }
    header .container { display: flex; align-items: center; gap: 16px; height: 52px; max-width: 980px; margin: 0 auto; padding: 0 20px; }
    .header-nav { display: flex; align-items: center; gap: 20px; margin-left: 8px; }
    .header-nav a { color: var(--text-secondary); text-decoration: none; font-size: 13px; font-weight: 400; transition: color 0.12s ease; }
    .header-nav a:hover { color: var(--accent); }
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 18px; border-radius: 980px; font-size: 13px; font-weight: 500; text-decoration: none; transition: background 0.12s ease; cursor: pointer; border: none; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-deep); }
    .btn-secondary { background: var(--hover); color: var(--accent); }
    .btn-secondary:hover { background: var(--accent-soft); }

    .header-theme-wrapper { position: relative; margin-left: auto; }
    .header-theme { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 980px; border: none; background: var(--hover); color: var(--text-secondary); font-size: 13px; font-family: inherit; cursor: pointer; transition: background 0.12s ease; }
    .header-theme:hover { background: var(--accent-soft); color: var(--text); }
    .header-theme-menu { position: absolute; top: calc(100% + 6px); right: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 5px; min-width: 160px; box-shadow: 0 0 0 0.5px rgba(0,0,0,0.08), 0 8px 30px rgba(0,0,0,0.12); z-index: 110; opacity: 0; pointer-events: none; transform: translateY(-4px); transition: opacity 0.15s ease, transform 0.15s ease; }
    .header-theme-menu.open { opacity: 1; pointer-events: auto; transform: translateY(0); }
    .header-theme-menu button { width: 100%; text-align: left; padding: 7px 10px; border-radius: 7px; border: none; background: transparent; color: var(--text); font-family: inherit; font-size: 13px; cursor: pointer; }
    .header-theme-menu button:hover { background: var(--hover); }
    .header-theme-menu button.active { color: var(--accent); font-weight: 600; }
    .mobile-nav-toggle { display: none; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; }
    .mobile-nav-toggle:hover { background: var(--hover); }
    .mobile-nav-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 200; opacity: 0; transition: opacity .25s ease; }
    .mobile-nav-overlay.open { opacity: 1; }
    .mobile-nav-panel { position: fixed; top: 0; left: 0; bottom: 0; width: 280px; background: var(--surface); border-right: 1px solid var(--border); z-index: 201; transform: translateX(-100%); transition: transform .25s ease; padding: 24px; display: flex; flex-direction: column; }
    .mobile-nav-panel.open { transform: translateX(0); }
    .mobile-nav-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .mobile-nav-close { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; }
    .mobile-nav-close:hover { background: var(--hover); }
    .mobile-nav-divider { height: 1px; background: var(--border); margin: 8px 0; }
    .mobile-nav-panel .nav-link { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 8px; color: var(--text); text-decoration: none; font-weight: 500; transition: background .15s; }
    .mobile-nav-panel .nav-link:hover { background: var(--hover); }
    .mobile-nav-panel .nav-link.active { color: var(--accent); }
    .mobile-nav-panel .btn { margin-top: 12px; }
    @media (max-width: 768px) {
      .header-theme-label { display: none; }
      .mobile-nav-toggle { display: flex; }
      .header-nav { display: none; }
      header .container { padding: 0 16px; gap: 10px; }
      header .container .btn { padding: 7px 14px; }
      .wall-container { padding: 68px 16px 48px; }
      .wall-cover { height: 104px; }
      .wall-header { border-radius: 14px; margin-bottom: 24px; }
      .wall-body { padding: 0 18px 20px; margin-top: -40px; gap: 14px; }
      .wall-avatar, .wall-avatar-img { width: 84px; height: 84px; border-width: 3px; font-size: 32px; }
      .wall-info-block h1, .wall-info h1 { font-size: 22px; }
      .wall-page-card { padding: 10px 12px 10px 10px; gap: 12px; }
      .wall-page-icon { width: 34px; height: 34px; }
    }

    .wall-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 76px 20px 56px;
    }
    .wall-cover {
      height: 148px;
      background: linear-gradient(180deg, #e4e4e9 0%, var(--bg) 100%);
      position: relative;
    }
    [data-theme="dark"] .wall-cover {
      background: linear-gradient(180deg, #2c2c2e 0%, var(--bg) 100%);
    }
    .wall-header {
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      margin-bottom: 36px;
      background: var(--surface);
      border: 1px solid var(--border-subtle);
    }
    .wall-body {
      display: flex; align-items: flex-end; gap: 20px;
      padding: 0 28px 24px;
      margin-top: -48px;
      position: relative; z-index: 2;
    }
    .wall-info-block { flex: 1; min-width: 0; }
    .wall-info-block h1 {
      font-size: 28px; font-weight: 700; letter-spacing: -0.022em; line-height: 1.15; margin: 0 0 2px;
    }
    .wall-info-block .username {
      color: var(--muted); font-size: 14px; font-weight: 400; margin: 0;
    }
    .wall-info-block .bio {
      margin: 10px 0 0; color: var(--text-secondary); font-size: 15px; max-width: 480px; line-height: 1.55;
    }
    .hero-cta {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 16px; border-radius: 980px; border: none;
      background: var(--accent-soft);
      color: var(--accent); text-decoration: none; font-size: 13px; font-weight: 500;
      transition: background 0.12s ease;
      margin-top: 12px;
    }
    .hero-cta:hover { background: var(--accent-wash); }
    .wall-avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 4px solid var(--surface);
      background: linear-gradient(180deg, #6e6e73 0%, #48484a 100%);
      display: grid;
      place-items: center;
      font-size: 44px;
      font-weight: 600;
      color: #fff;
      flex-shrink: 0;
    }
    .wall-avatar-img {
      width: 120px; height: 120px; border-radius: 50%; object-fit: cover;
      border: 4px solid var(--surface);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
      flex-shrink: 0;
    }
    .wall-info h1 {
      font-size: 28px; font-weight: 700; letter-spacing: -0.022em; line-height: 1.15; margin-bottom: 4px;
    }
    .wall-info .username {
      color: var(--muted); font-size: 14px; font-weight: 400;
    }
    .wall-info .bio {
      margin-top: 10px; color: var(--text-secondary); font-size: 15px; max-width: 480px; line-height: 1.55;
    }
    .wall-section-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 12px;
      scroll-margin-top: 76px;
    }
    .wall-pages {
      display: flex;
      flex-direction: column;
      gap: 8px;
      scroll-margin-top: 76px;
    }
    .wall-page-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px 12px 12px;
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      text-decoration: none;
      color: var(--text);
      transition: background 0.12s ease, box-shadow 0.12s ease;
    }
    .wall-page-card:hover {
      background: var(--surface);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    }
    .wall-page-icon {
      width: 38px;
      height: 38px;
      border-radius: 9px;
      background: var(--hover);
      display: grid;
      place-items: center;
      font-size: 17px;
      flex-shrink: 0;
    }
    .wall-page-info {
      flex: 1;
      min-width: 0;
    }
    .wall-page-info h3 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin-bottom: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .wall-page-info .meta {
      font-size: 12px;
      color: var(--muted);
    }
    .wall-page-arrow {
      color: rgba(120, 120, 128, 0.5);
      font-size: 16px;
      flex-shrink: 0;
    }
    .wall-empty {
      text-align: center;
      padding: 48px 24px;
      color: var(--muted);
    }
    .wall-empty-icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.5;
    }
    .wall-nav {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 32px;
    }
    .wall-nav a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.2s;
    }
    .wall-nav a:hover {
      color: var(--accent);
    }
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px;
      color: var(--muted);
    }
    .error {
      text-align: center;
      padding: 48px;
      color: var(--text);
    }
    .error h2 { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 8px; }
    .error p { color: var(--muted); }
    .error a { color: var(--accent); text-decoration: none; }
    .error a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  {% include 'components/navbar.html' %}
  <div class="wall-container">
    <div id="wall-content">
      <div class="loading">Loading...</div>
    </div>
  </div>

  <script>
    const username = {{ username | tojson }};

    async function loadWall() {
      try {
        const res = await fetch(`/api/users/${username}`);
        if (!res.ok) throw new Error('User not found');
        const data = await res.json();

        const content = document.getElementById('wall-content');
        const initial = data.profile;
        const displayName = initial.display_name || username;
        const bio = initial.bio || '';
        const avatarUrl = initial.avatar_url || '';

        function topLevelPages() {
          // Wall lists ONLY top-level pages. Subpages are reachable solely
          // via their parent's public page (nesting).
          if (data.nested_pages && data.nested_pages.length) return data.nested_pages;
          const all = data.pages || [];
          const ids = new Set(all.map(p => p.id));
          return all.filter(p => !p.parent_id || p.parent_id === 'root' || !ids.has(p.parent_id));
        }

        function renderTopLevelPages(nodes) {
          if (!nodes || !nodes.length) return '';
          return nodes.map(page => {
            const count = page.subpage_count || (page.children ? page.children.length : 0);
            const sub = count > 0 ? ` · ${count} subpage${count === 1 ? '' : 's'}` : '';
            return `
            <a href="/p/${username}/${page.id}" class="wall-page-card">
              <div class="wall-page-icon">📄</div>
              <div class="wall-page-info">
                <h3>${escapeHtml(page.title || 'Untitled')}</h3>
                <span class="meta">Updated ${formatDate(page.updated_at)}${sub}</span>
              </div>
              <span class="wall-page-arrow">→</span>
            </a>`;
          }).join('');
        }

        let pagesHtml = '';
        const topPages = topLevelPages();
        if (topPages.length > 0) {
          pagesHtml = `
            <p class="wall-section-title" id="public-pages">Public Pages</p>
            <div class="wall-pages">
              ${renderTopLevelPages(topPages)}
            </div>
          `;
        } else {
          pagesHtml = `
            <div class="wall-empty">
              <div class="wall-empty-icon">📭</div>
              <p>No public pages yet</p>
            </div>
          `;
        }

        content.innerHTML = `
          <header class="wall-header">
            <div class="wall-cover"></div>
            <div class="wall-body">
              <img src="${avatarUrl}" class="wall-avatar-img" alt="${escapeHtml(displayName)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
              <div class="wall-avatar" style="display:none;">${displayName.charAt(0).toUpperCase()}</div>
              <div class="wall-info-block">
                <h1>${escapeHtml(displayName)}</h1>
                <p class="username">@${username}</p>
                ${bio ? `<p class="bio">${escapeHtml(bio)}</p>` : ''}
              </div>
            </div>
          </header>
          ${pagesHtml}
        `;
      } catch (err) {
        document.getElementById('wall-content').innerHTML = `
          <div class="error">
            <h2>User not found</h2>
            <p>This user doesn't exist or has no public content.</p>
            <p style="margin-top:16px;"><a href="/search">Search users</a></p>
          </div>
        `;
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function formatDate(timestamp) {
      if (!timestamp) return 'unknown';
      const date = new Date(timestamp * 1000);
      return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    }

    loadWall();
  </script>

  <script src="/static/js/theme.js"></script>
  <script>
    const themeBtn = document.getElementById('headerThemeBtn');
    const themeMenu = document.getElementById('headerThemeMenu');
    const themeLabel = document.getElementById('themeLabel');
    const themeIconLight = document.getElementById('themeIconLight');
    const themeIconDark = document.getElementById('themeIconDark');
    const themeIconAuto = document.getElementById('themeIconAuto');
    function updateThemeIcon(mode) {
      themeIconLight.style.display = mode === 'light' ? 'block' : 'none';
      themeIconDark.style.display = mode === 'dark' ? 'block' : 'none';
      themeIconAuto.style.display = mode === 'auto' ? 'block' : 'none';
      themeLabel.textContent = mode === 'light' ? 'Light' : mode === 'dark' ? 'Dark' : 'Auto';
    }
    themeBtn.addEventListener('click', (e) => { e.stopPropagation(); themeMenu.classList.toggle('open'); });
    document.addEventListener('click', () => themeMenu.classList.remove('open'));
    document.querySelectorAll('.header-theme-menu .theme-btn').forEach(b => {
      b.addEventListener('click', () => { applyTheme(b.dataset.theme); updateThemeIcon(b.dataset.theme); themeMenu.classList.remove('open'); });
    });
    updateThemeIcon(getTheme());
  </script>
  <script>
    const mobileNavToggle = document.getElementById('mobileNavToggle');
    const mobileNavOverlay = document.getElementById('mobileNavOverlay');
    const mobileNavPanel = document.getElementById('mobileNavPanel');
    const mobileNavClose = document.getElementById('mobileNavClose');
    function openMobileNav() { mobileNavOverlay.classList.add('open'); mobileNavPanel.classList.add('open'); document.body.style.overflow = 'hidden'; }
    function closeMobileNav() { mobileNavOverlay.classList.remove('open'); mobileNavPanel.classList.remove('open'); document.body.style.overflow = ''; }
    mobileNavToggle.addEventListener('click', openMobileNav);
    mobileNavOverlay.addEventListener('click', closeMobileNav);
    mobileNavClose.addEventListener('click', closeMobileNav);
  </script>
</body>
</html>
