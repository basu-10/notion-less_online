<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#d85b45">
  <title>{{ username }}'s Wall — NotionLess Cloud</title>
  <link rel="preconnect" href="https://esm.sh">
  <link rel="stylesheet" href="/static/css/theme.css">
  <link rel="stylesheet" href="/static/css/auth.css">
  <script>
    (function() {
      var t;
      try { t = localStorage.getItem("notion-theme"); } catch(e) {}
      var theme = (t === "dark" || t === "light") ? t : (
        window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
      );
      if (theme === "dark") { document.documentElement.setAttribute("data-theme", "dark"); }
    })();
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #fafaf8;
      --surface: #ffffff;
      --border: #e8e5df;
      --text: #1a1a18;
      --muted: #8a8780;
      --hover: #f0efed;
      --accent: #d85b45;
      --accent-light: #e87a6a;
      --header-bg: rgba(250, 250, 248, 0.85);
    }
    [data-theme="dark"] {
      --bg: #18181b;
      --surface: #1c1c21;
      --border: #2a2a2f;
      --text: #e8e8ef;
      --muted: #a7a7a3;
      --hover: #2a2a30;
      --header-bg: rgba(24, 24, 27, 0.85);
    }
    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    .wall-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 80px 24px 48px;
    }
    .wall-header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 40px;
      padding-bottom: 32px;
      border-bottom: 1px solid var(--border);
    }
    .wall-avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-light));
      display: grid;
      place-items: center;
      font-size: 28px;
      font-weight: 700;
      color: white;
      flex-shrink: 0;
    }
    .wall-info h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }
    .wall-info .username {
      color: var(--muted);
      font-size: 0.95rem;
    }
    .wall-info .bio {
      margin-top: 8px;
      color: var(--text);
      font-size: 0.95rem;
      max-width: 400px;
    }
    .wall-section-title {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 20px;
    }
    .wall-pages {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .wall-page-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .wall-page-card:hover {
      border-color: var(--accent);
      box-shadow: 0 4px 16px rgba(216, 91, 69, 0.1);
      transform: translateY(-2px);
    }
    .wall-page-icon {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background: var(--hover);
      display: grid;
      place-items: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .wall-page-info {
      flex: 1;
      min-width: 0;
    }
    .wall-page-info h3 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .wall-page-info .meta {
      font-size: 0.8rem;
      color: var(--muted);
    }
    .wall-page-arrow {
      color: var(--muted);
      font-size: 1.2rem;
    }
    .wall-empty {
      text-align: center;
      padding: 48px 24px;
      color: var(--muted);
    }
    .wall-empty-icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.5;
    }
    .wall-nav {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 32px;
    }
    .wall-nav a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.2s;
    }
    .wall-nav a:hover {
      color: var(--accent);
    }
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px;
      color: var(--muted);
    }
    .error {
      text-align: center;
      padding: 48px;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="wall-container">
    <nav class="wall-nav">
      <a href="/">
        <span>←</span> Home
      </a>
      <a href="/search">
        <span>🔍</span> Search users
      </a>
    </nav>

    <div id="wall-content">
      <div class="loading">Loading...</div>
    </div>
  </div>

  <script>
    const username = {{ username | tojson }};

    async function loadWall() {
      try {
        const res = await fetch(`/api/users/${username}`);
        if (!res.ok) throw new Error('User not found');
        const data = await res.json();

        const content = document.getElementById('wall-content');
        const initial = data.profile;
        const displayName = initial.display_name || username;
        const bio = initial.bio || '';
        const avatar = displayName.charAt(0).toUpperCase();

        let pagesHtml = '';
        if (data.pages && data.pages.length > 0) {
          pagesHtml = `
            <p class="wall-section-title">Public Pages</p>
            <div class="wall-pages">
              ${data.pages.map(page => `
                <a href="/p/${username}/${page.id}" class="wall-page-card">
                  <div class="wall-page-icon">📄</div>
                  <div class="wall-page-info">
                    <h3>${escapeHtml(page.title || 'Untitled')}</h3>
                    <span class="meta">Updated ${formatDate(page.updated_at)}</span>
                  </div>
                  <span class="wall-page-arrow">→</span>
                </a>
              `).join('')}
            </div>
          `;
        } else {
          pagesHtml = `
            <div class="wall-empty">
              <div class="wall-empty-icon">📭</div>
              <p>No public pages yet</p>
            </div>
          `;
        }

        content.innerHTML = `
          <header class="wall-header">
            <div class="wall-avatar">${avatar}</div>
            <div class="wall-info">
              <h1>${escapeHtml(displayName)}</h1>
              <p class="username">@${username}</p>
              ${bio ? `<p class="bio">${escapeHtml(bio)}</p>` : ''}
            </div>
          </header>
          ${pagesHtml}
        `;
      } catch (err) {
        document.getElementById('wall-content').innerHTML = `
          <div class="error">
            <h2>User not found</h2>
            <p>This user doesn't exist or has no public content.</p>
            <p style="margin-top:16px;"><a href="/search">Search users</a></p>
          </div>
        `;
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function formatDate(timestamp) {
      if (!timestamp) return 'unknown';
      const date = new Date(timestamp * 1000);
      return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    }

    loadWall();
  </script>
</body>
</html>
