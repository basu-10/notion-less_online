<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>Search Users — NotionLess</title>
  <link rel="preconnect" href="https://esm.sh">
  <script>
    (function() {
      var t;
      try { t = localStorage.getItem("notion-theme"); } catch(e) {}
      var theme = (t === "dark" || t === "light") ? t : (
        window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
      );
      if (theme === "dark") { document.documentElement.setAttribute("data-theme", "dark"); }
    })();
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f5f5f7;
      --surface: #ffffff;
      --border: rgba(0, 0, 0, 0.08);
      --border-subtle: rgba(0, 0, 0, 0.04);
      --text: #1d1d1f;
      --text-secondary: #515154;
      --muted: #86868b;
      --hover: rgba(0, 0, 0, 0.04);
      --accent: #0071e3;
      --accent-deep: #0068d1;
      --accent-soft: rgba(0, 113, 227, 0.08);
      --accent-wash: rgba(0, 113, 227, 0.14);
      --field: rgba(120, 120, 128, 0.12);
      --header-bg: rgba(245, 245, 247, 0.72);
    }
    [data-theme="dark"] {
      --bg: #000000;
      --surface: #1d1d1f;
      --border: rgba(255, 255, 255, 0.12);
      --border-subtle: rgba(255, 255, 255, 0.06);
      --text: #f5f5f7;
      --text-secondary: #a1a1a6;
      --muted: #86868b;
      --hover: rgba(255, 255, 255, 0.06);
      --accent: #0a84ff;
      --accent-deep: #409cff;
      --accent-soft: rgba(10, 132, 255, 0.14);
      --accent-wash: rgba(10, 132, 255, 0.22);
      --field: rgba(120, 120, 128, 0.24);
      --header-bg: rgba(0, 0, 0, 0.72);
    }
    html { scroll-behavior: smooth; }
    html, body { height: auto; overflow: auto; overflow-x: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, Inter, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      letter-spacing: -0.01em;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      overflow-y: auto;
      overflow-x: hidden;
    }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; letter-spacing: -0.02em; color: var(--text); text-decoration: none; }
    .brand-mark { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 7px; background: #1d1d1f; font-weight: 700; font-size: 11px; letter-spacing: -0.04em; color: #fff; flex-shrink: 0; }
    [data-theme="dark"] .brand-mark { background: #f5f5f7; color: #000; }
    .site-header { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: var(--header-bg); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); border-bottom: 1px solid var(--border-subtle); }
    .site-header .container { display: flex; align-items: center; gap: 16px; height: 52px; max-width: 980px; margin: 0 auto; padding: 0 20px; }
    .header-nav { display: flex; align-items: center; gap: 20px; margin-left: 8px; }
    .header-nav a { color: var(--text-secondary); text-decoration: none; font-size: 13px; font-weight: 400; transition: color 0.12s ease; }
    .header-nav a:hover { color: var(--accent); }
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 18px; border-radius: 980px; font-size: 13px; font-weight: 500; text-decoration: none; transition: background 0.12s ease; cursor: pointer; border: none; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-deep); }
    .btn-secondary { background: var(--hover); color: var(--accent); }
    .btn-secondary:hover { background: var(--accent-soft); }
    .header-theme-wrapper { position: relative; margin-left: auto; }
    .header-theme { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 980px; border: none; background: var(--hover); color: var(--text-secondary); font-size: 13px; font-family: inherit; cursor: pointer; transition: background 0.12s ease; }
    .header-theme:hover { background: var(--accent-soft); color: var(--text); }
    .header-theme-menu { position: absolute; top: calc(100% + 6px); right: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 5px; min-width: 160px; box-shadow: 0 0 0 0.5px rgba(0,0,0,0.08), 0 8px 30px rgba(0,0,0,0.12); z-index: 110; opacity: 0; pointer-events: none; transform: translateY(-4px); transition: opacity 0.15s ease, transform 0.15s ease; }
    .header-theme-menu.open { opacity: 1; pointer-events: auto; transform: translateY(0); }
    .header-theme-menu button { width: 100%; text-align: left; padding: 7px 10px; border-radius: 7px; border: none; background: transparent; color: var(--text); font-family: inherit; font-size: 13px; cursor: pointer; }
    .header-theme-menu button:hover { background: var(--hover); }
    .header-theme-menu button.active { color: var(--accent); font-weight: 600; }
    .mobile-nav-toggle { display: none; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; }
    .mobile-nav-toggle:hover { background: var(--hover); }
    .mobile-nav-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 200; opacity: 0; transition: opacity .25s ease; }
    .mobile-nav-overlay.open { opacity: 1; }
    .mobile-nav-panel { position: fixed; top: 0; left: 0; bottom: 0; width: 280px; background: var(--surface); border-right: 1px solid var(--border); z-index: 201; transform: translateX(-100%); transition: transform .25s ease; padding: 24px; display: flex; flex-direction: column; }
    .mobile-nav-panel.open { transform: translateX(0); }
    .mobile-nav-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .mobile-nav-close { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; }
    .mobile-nav-close:hover { background: var(--hover); }
    .mobile-nav-divider { height: 1px; background: var(--border); margin: 8px 0; }
    .mobile-nav-panel .nav-link { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 8px; color: var(--text); text-decoration: none; font-weight: 500; transition: background .15s; }
    .mobile-nav-panel .nav-link:hover { background: var(--hover); }
    .mobile-nav-panel .nav-link.active { color: var(--accent); }
    .mobile-nav-panel .btn { margin-top: 12px; }
    @media (max-width: 768px) {
      .header-theme-label { display: none; }
      .mobile-nav-toggle { display: flex; }
      .header-nav { display: none; }
      .site-header .container { padding: 0 16px; gap: 10px; }
      .site-header .container .btn { padding: 7px 14px; }
      .search-container { padding: 76px 16px 48px; }
      .search-header h1 { font-size: 24px; }
      .search-header p { font-size: 14px; }
      .search-input { font-size: 16px; padding: 11px 14px 11px 36px; }
      .search-result-card { padding: 9px 12px 9px 9px; gap: 10px; }
      .result-avatar { width: 40px; height: 40px; font-size: 16px; }
    }

    .search-container {
      max-width: 640px;
      margin: 0 auto;
      padding: 96px 20px 56px;
    }
    .search-header {
      margin-bottom: 20px;
    }
    .search-header h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.022em;
      line-height: 1.15;
      margin-bottom: 6px;
    }
    .search-header p {
      color: var(--muted);
      font-size: 15px;
    }
    .search-nav {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 32px;
    }
    .search-nav a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.2s;
    }
    .search-nav a:hover {
      color: var(--accent);
    }
    .search-input-wrap {
      position: relative;
      margin-bottom: 20px;
    }
    .search-input {
      width: 100%;
      padding: 12px 16px 12px 38px;
      font-size: 17px;
      letter-spacing: -0.01em;
      font-family: inherit;
      border: none;
      border-radius: 12px;
      background: var(--field);
      color: var(--text);
      transition: box-shadow 0.12s ease, background 0.12s ease;
    }
    .search-input:focus {
      outline: none;
      background: var(--surface);
      box-shadow: 0 0 0 3.5px var(--accent-wash), 0 0 0 1px var(--accent);
    }
    .search-input::placeholder {
      color: var(--muted);
    }
    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      display: inline-flex;
      pointer-events: none;
    }
    .search-results {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .search-result-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px 10px 10px;
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      text-decoration: none;
      color: var(--text);
      transition: box-shadow 0.12s ease;
    }
    .search-result-card:hover {
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    }
    .result-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(180deg, #6e6e73 0%, #48484a 100%);
      display: grid;
      place-items: center;
      font-size: 18px;
      font-weight: 600;
      color: #fff;
      flex-shrink: 0;
    }
    .result-info {
      flex: 1;
      min-width: 0;
    }
    .result-info h3 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin-bottom: 1px;
    }
    .result-info .username {
      font-size: 13px;
      color: var(--muted);
    }
    .result-info .bio {
      font-size: 13px;
      color: var(--muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .result-arrow {
      color: rgba(120, 120, 128, 0.5);
      font-size: 16px;
      flex-shrink: 0;
    }
    .search-empty {
      text-align: center;
      padding: 48px 24px;
      color: var(--muted);
      font-size: 14px;
    }
    .search-empty-icon {
      display: inline-flex;
      margin-bottom: 12px;
      opacity: 0.5;
    }
    .search-hint {
      text-align: center;
      padding: 40px 24px;
      color: var(--muted);
      font-size: 14px;
    }
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px;
      color: var(--muted);
      font-size: 14px;
    }
  </style>
</head>
<body>
  {% include 'components/navbar.html' %}
  <div class="search-container">
    <div class="search-header">
      <h1>Find Users</h1>
      <p>Search for people and explore their public pages</p>
    </div>

    <div class="search-input-wrap">
      <span class="search-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg></span>
      <input
        type="text"
        class="search-input"
        id="searchInput"
        placeholder="Search by username or display name..."
        autocomplete="off"
      >
    </div>

    <div id="searchResults">
      <div class="search-hint">Start typing to search for users</div>
    </div>
  </div>

  <script>
    const searchInput = document.getElementById('searchInput');
    const resultsContainer = document.getElementById('searchResults');
    let searchTimeout = null;

    async function searchUsers(query) {
      if (!query || query.length < 1) {
        resultsContainer.innerHTML = '<div class="search-hint">Start typing to search for users</div>';
        return;
      }

      resultsContainer.innerHTML = '<div class="loading">Searching...</div>';

      try {
        const res = await fetch(`/api/users/search?q=${encodeURIComponent(query)}`);
        const users = await res.json();

        if (!users || users.length === 0) {
          resultsContainer.innerHTML = `
            <div class="search-empty">
              <div class="search-empty-icon" aria-hidden="true"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg></div>
              <p>No users found for "${escapeHtml(query)}"</p>
            </div>
          `;
          return;
        }

        resultsContainer.innerHTML = `
          <div class="search-results">
            ${users.map(user => {
              const displayName = user.display_name || user.username;
              const avatar = displayName.charAt(0).toUpperCase();
              return `
                <a href="/wall/${user.username}" class="search-result-card">
                  <div class="result-avatar">${avatar}</div>
                  <div class="result-info">
                    <h3>${escapeHtml(displayName)}</h3>
                    <span class="username">@${escapeHtml(user.username)}</span>
                    ${user.bio ? `<p class="bio">${escapeHtml(user.bio)}</p>` : ''}
                  </div>
                  <span class="result-arrow">→</span>
                </a>
              `;
            }).join('')}
          </div>
        `;
      } catch (err) {
        resultsContainer.innerHTML = `
          <div class="search-empty">
            <p>Search failed. Please try again.</p>
          </div>
        `;
      }
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    searchInput.addEventListener('input', (e) => {
      const query = e.target.value.trim();
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => searchUsers(query), 300);
    });

    searchInput.focus();
  </script>

  <script src="/static/js/theme.js"></script>
  <script>
    const themeBtn = document.getElementById('headerThemeBtn');
    const themeMenu = document.getElementById('headerThemeMenu');
    const themeLabel = document.getElementById('themeLabel');
    const themeIconLight = document.getElementById('themeIconLight');
    const themeIconDark = document.getElementById('themeIconDark');
    const themeIconAuto = document.getElementById('themeIconAuto');

    function updateThemeIcon(mode) {
      themeIconLight.style.display = mode === 'light' ? 'block' : 'none';
      themeIconDark.style.display = mode === 'dark' ? 'block' : 'none';
      themeIconAuto.style.display = mode === 'auto' ? 'block' : 'none';
      themeLabel.textContent = mode === 'light' ? 'Light' : mode === 'dark' ? 'Dark' : 'Auto';
    }

    themeBtn.addEventListener('click', (e) => { e.stopPropagation(); themeMenu.classList.toggle('open'); });
    document.addEventListener('click', () => themeMenu.classList.remove('open'));
    document.querySelectorAll('.header-theme-menu .theme-btn').forEach(b => {
      b.addEventListener('click', () => { applyTheme(b.dataset.theme); updateThemeIcon(b.dataset.theme); themeMenu.classList.remove('open'); });
    });
    updateThemeIcon(getTheme());
  </script>
  <script>
    const mobileNavToggle = document.getElementById('mobileNavToggle');
    const mobileNavOverlay = document.getElementById('mobileNavOverlay');
    const mobileNavPanel = document.getElementById('mobileNavPanel');
    const mobileNavClose = document.getElementById('mobileNavClose');
    function openMobileNav() { mobileNavOverlay.classList.add('open'); mobileNavPanel.classList.add('open'); document.body.style.overflow = 'hidden'; }
    function closeMobileNav() { mobileNavOverlay.classList.remove('open'); mobileNavPanel.classList.remove('open'); document.body.style.overflow = ''; }
    mobileNavToggle.addEventListener('click', openMobileNav);
    mobileNavOverlay.addEventListener('click', closeMobileNav);
    mobileNavClose.addEventListener('click', closeMobileNav);
  </script>
</body>
</html>
