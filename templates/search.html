<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#d85b45">
  <title>Search Users — NotionLess Cloud</title>
  <link rel="preconnect" href="https://esm.sh">
  <link rel="stylesheet" href="/static/css/theme.css">
  <link rel="stylesheet" href="/static/css/auth.css">
  <link rel="stylesheet" href="/static/css/theme.css">
  <script>
    (function() {
      var t;
      try { t = localStorage.getItem("notion-theme"); } catch(e) {}
      var theme = (t === "dark" || t === "light") ? t : (
        window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
      );
      if (theme === "dark") { document.documentElement.setAttribute("data-theme", "dark"); }
    })();
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #fafaf8;
      --surface: #ffffff;
      --border: #e8e5df;
      --text: #1a1a18;
      --muted: #8a8780;
      --hover: #f0efed;
      --accent: #d85b45;
      --accent-light: #e87a6a;
    }
    [data-theme="dark"] {
      --bg: #18181b;
      --surface: #1c1c21;
      --border: #2a2a2f;
      --text: #e8e8ef;
      --muted: #a7a7a3;
      --hover: #2a2a30;
    }
    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 0.95rem; color: var(--text); text-decoration: none; }
    .brand-mark { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; background: var(--surface); border: 1px solid var(--border); box-shadow: 0 2px 8px rgba(0,0,0,0.04); font-weight: 700; font-size: 12px; color: var(--accent); }
    header { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: var(--header-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
    header .container { display: flex; align-items: center; justify-content: space-between; height: 64px; }
    .header-nav { display: flex; align-items: center; gap: 32px; }
    .header-nav a { color: var(--muted); text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: color 0.2s ease; }
    .header-nav a:hover { color: var(--text); }
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px; border-radius: 8px; font-size: 0.9rem; font-weight: 600; text-decoration: none; transition: all 0.2s ease; cursor: pointer; border: none; }
    .btn-primary { background: var(--accent); color: white; box-shadow: 0 4px 16px rgba(216,91,69,0.25); }
    .btn-primary:hover { background: var(--accent-light); transform: translateY(-1px); box-shadow: 0 6px 24px rgba(216,91,69,0.3); }
    .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
    .btn-secondary:hover { background: var(--hover); transform: translateY(-1px); }
    .header-theme-wrapper { position: relative; }
    .header-theme { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 0.85rem; font-family: inherit; cursor: pointer; transition: all 0.2s ease; }
    .header-theme:hover { border-color: var(--accent); }
    .header-theme-menu { position: absolute; top: calc(100% + 6px); right: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 6px; min-width: 140px; box-shadow: 0 12px 32px rgba(0,0,0,0.12); z-index: 110; opacity: 0; pointer-events: none; transform: translateY(-4px); transition: all 0.2s ease; }
    .header-theme-menu.open { opacity: 1; pointer-events: auto; transform: translateY(0); }
    .header-theme-menu button { width: 100%; text-align: left; padding: 8px 10px; border-radius: 6px; border: none; background: transparent; color: var(--text); font-family: inherit; font-size: 0.85rem; cursor: pointer; transition: background 0.15s; }
    .header-theme-menu button:hover { background: var(--hover); }
    .header-theme-menu button.active { background: var(--accent); color: white; }
    .mobile-nav-toggle { display: none; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; }
    .mobile-nav-toggle:hover { background: var(--hover); }
    .mobile-nav-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 200; opacity: 0; transition: opacity .25s ease; }
    .mobile-nav-overlay.open { opacity: 1; }
    .mobile-nav-panel { position: fixed; top: 0; left: 0; bottom: 0; width: 280px; background: var(--surface); border-right: 1px solid var(--border); z-index: 201; transform: translateX(-100%); transition: transform .25s ease; padding: 24px; display: flex; flex-direction: column; }
    .mobile-nav-panel.open { transform: translateX(0); }
    .mobile-nav-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .mobile-nav-close { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; }
    .mobile-nav-close:hover { background: var(--hover); }
    .mobile-nav-divider { height: 1px; background: var(--border); margin: 8px 0; }
    .mobile-nav-panel .nav-link { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 8px; color: var(--text); text-decoration: none; font-weight: 500; transition: background .15s; }
    .mobile-nav-panel .nav-link:hover { background: var(--hover); }
    .mobile-nav-panel .nav-link.active { color: var(--accent); }
    @media (max-width: 768px) { .header-theme-label { display: none; } .mobile-nav-toggle { display: flex; } .header-nav { display: none; } }

    .search-container {
      max-width: 600px;
      margin: 0 auto;
      padding: 80px 24px 48px;
    }
    .search-header {
      margin-bottom: 32px;
    }
    .search-header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }
    .search-header p {
      color: var(--muted);
    }
    .search-nav {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 32px;
    }
    .search-nav a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.2s;
    }
    .search-nav a:hover {
      color: var(--accent);
    }
    .search-input-wrap {
      position: relative;
      margin-bottom: 32px;
    }
    .search-input {
      width: 100%;
      padding: 14px 16px 14px 48px;
      font-size: 1rem;
      font-family: inherit;
      border: 2px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      transition: border-color 0.2s;
    }
    .search-input:focus {
      outline: none;
      border-color: var(--accent);
    }
    .search-input::placeholder {
      color: var(--muted);
    }
    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 1.1rem;
    }
    .search-results {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .search-result-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .search-result-card:hover {
      border-color: var(--accent);
      box-shadow: 0 4px 16px rgba(216, 91, 69, 0.1);
      transform: translateY(-2px);
    }
    .result-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-light));
      display: grid;
      place-items: center;
      font-size: 20px;
      font-weight: 700;
      color: white;
      flex-shrink: 0;
    }
    .result-info {
      flex: 1;
      min-width: 0;
    }
    .result-info h3 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 2px;
    }
    .result-info .username {
      font-size: 0.85rem;
      color: var(--muted);
    }
    .result-info .bio {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .result-arrow {
      color: var(--muted);
      font-size: 1.2rem;
    }
    .search-empty {
      text-align: center;
      padding: 48px 24px;
      color: var(--muted);
    }
    .search-empty-icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.5;
    }
    .search-hint {
      text-align: center;
      padding: 48px 24px;
      color: var(--muted);
    }
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  {% include 'components/navbar.html' %}
  <div class="search-container">
    <header class="search-header">
      <h1>Find Users</h1>
      <p>Search for people and explore their public pages</p>
    </header>

    <div class="search-input-wrap">
      <span class="search-icon">🔍</span>
      <input
        type="text"
        class="search-input"
        id="searchInput"
        placeholder="Search by username or display name..."
        autocomplete="off"
      >
    </div>

    <div id="searchResults">
      <div class="search-hint">Start typing to search for users</div>
    </div>
  </div>

  <script>
    const searchInput = document.getElementById('searchInput');
    const resultsContainer = document.getElementById('searchResults');
    let searchTimeout = null;

    async function searchUsers(query) {
      if (!query || query.length < 1) {
        resultsContainer.innerHTML = '<div class="search-hint">Start typing to search for users</div>';
        return;
      }

      resultsContainer.innerHTML = '<div class="loading">Searching...</div>';

      try {
        const res = await fetch(`/api/users/search?q=${encodeURIComponent(query)}`);
        const users = await res.json();

        if (!users || users.length === 0) {
          resultsContainer.innerHTML = `
            <div class="search-empty">
              <div class="search-empty-icon">🔍</div>
              <p>No users found for "${escapeHtml(query)}"</p>
            </div>
          `;
          return;
        }

        resultsContainer.innerHTML = `
          <div class="search-results">
            ${users.map(user => {
              const displayName = user.display_name || user.username;
              const avatar = displayName.charAt(0).toUpperCase();
              return `
                <a href="/wall/${user.username}" class="search-result-card">
                  <div class="result-avatar">${avatar}</div>
                  <div class="result-info">
                    <h3>${escapeHtml(displayName)}</h3>
                    <span class="username">@${escapeHtml(user.username)}</span>
                    ${user.bio ? `<p class="bio">${escapeHtml(user.bio)}</p>` : ''}
                  </div>
                  <span class="result-arrow">→</span>
                </a>
              `;
            }).join('')}
          </div>
        `;
      } catch (err) {
        resultsContainer.innerHTML = `
          <div class="search-empty">
            <p>Search failed. Please try again.</p>
          </div>
        `;
      }
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    searchInput.addEventListener('input', (e) => {
      const query = e.target.value.trim();
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => searchUsers(query), 300);
    });

    searchInput.focus();
  </script>

  <script src="/static/js/theme.js"></script>
  <script>
    const themeBtn = document.getElementById('headerThemeBtn');
    const themeMenu = document.getElementById('headerThemeMenu');
    const themeLabel = document.getElementById('themeLabel');
    const themeIconLight = document.getElementById('themeIconLight');
    const themeIconDark = document.getElementById('themeIconDark');
    const themeIconAuto = document.getElementById('themeIconAuto');

    function updateThemeIcon(mode) {
      themeIconLight.style.display = mode === 'light' ? 'block' : 'none';
      themeIconDark.style.display = mode === 'dark' ? 'block' : 'none';
      themeIconAuto.style.display = mode === 'auto' ? 'block' : 'none';
      themeLabel.textContent = mode === 'light' ? 'Light' : mode === 'dark' ? 'Dark' : 'Auto';
    }

    themeBtn.addEventListener('click', (e) => { e.stopPropagation(); themeMenu.classList.toggle('open'); });
    document.addEventListener('click', () => themeMenu.classList.remove('open'));
    document.querySelectorAll('.header-theme-menu .theme-btn').forEach(b => {
      b.addEventListener('click', () => { applyTheme(b.dataset.theme); updateThemeIcon(b.dataset.theme); themeMenu.classList.remove('open'); });
    });
    updateThemeIcon(getTheme());
  </script>
  <script>
    const mobileNavToggle = document.getElementById('mobileNavToggle');
    const mobileNavOverlay = document.getElementById('mobileNavOverlay');
    const mobileNavPanel = document.getElementById('mobileNavPanel');
    const mobileNavClose = document.getElementById('mobileNavClose');
    function openMobileNav() { mobileNavOverlay.classList.add('open'); mobileNavPanel.classList.add('open'); document.body.style.overflow = 'hidden'; }
    function closeMobileNav() { mobileNavOverlay.classList.remove('open'); mobileNavPanel.classList.remove('open'); document.body.style.overflow = ''; }
    mobileNavToggle.addEventListener('click', openMobileNav);
    mobileNavOverlay.addEventListener('click', closeMobileNav);
    mobileNavClose.addEventListener('click', closeMobileNav);
  </script>
</body>
</html>
