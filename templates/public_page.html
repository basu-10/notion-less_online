<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#d85b45">
  <title>Loading... — NotionLess Cloud</title>
  <link rel="preconnect" href="https://esm.sh">
  <link rel="stylesheet" href="https://esm.sh/@blocknote/core@0.51.3/style.css">
  <link rel="stylesheet" href="https://esm.sh/@blocknote/core@0.51.3/fonts/inter.css">
  <link rel="stylesheet" href="/static/css/theme.css">
  <link rel="stylesheet" href="/static/css/auth.css">
  <script>
    (function() {
      var t;
      try { t = localStorage.getItem("notion-theme"); } catch(e) {}
      var theme = (t === "dark" || t === "light") ? t : (
        window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
      );
      if (theme === "dark") { document.documentElement.setAttribute("data-theme", "dark"); }
    })();
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #fafaf8;
      --surface: #ffffff;
      --border: #e8e5df;
      --text: #1a1a18;
      --muted: #8a8780;
      --hover: #f0efed;
      --accent: #d85b45;
      --accent-light: #e87a6a;
    }
    [data-theme="dark"] {
      --bg: #18181b;
      --surface: #1c1c21;
      --border: #2a2a2f;
      --text: #e8e8ef;
      --muted: #a7a7a3;
      --hover: #2a2a30;
    }
    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    .page-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 60px 24px 48px;
    }
    .page-nav {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 32px;
    }
    .page-nav a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.2s;
    }
    .page-nav a:hover {
      color: var(--accent);
    }
    .page-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }
    .page-header {
      padding: 32px 32px 24px;
      border-bottom: 1px solid var(--border);
    }
    .page-author {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .page-author-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-light));
      display: grid;
      place-items: center;
      font-size: 14px;
      font-weight: 700;
      color: white;
    }
    .page-author-info {
      font-size: 0.9rem;
    }
    .page-author-info a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    .page-author-info a:hover {
      text-decoration: underline;
    }
    .page-author-info .date {
      color: var(--muted);
      font-size: 0.8rem;
    }
    .page-title {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0;
    }
    .page-content {
      padding: 32px;
    }
    .page-content .bn-editor {
      min-height: 200px;
    }
    .page-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 20px 32px;
      border-top: 1px solid var(--border);
      background: var(--hover);
    }
    .copy-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .copy-btn:hover {
      background: var(--accent-light);
      transform: translateY(-1px);
    }
    .copy-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .copy-success {
      color: var(--accent);
      font-size: 0.9rem;
      font-weight: 500;
    }
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px;
      color: var(--muted);
    }
    .error {
      text-align: center;
      padding: 48px;
    }
    .error h2 {
      color: var(--accent);
      margin-bottom: 8px;
    }
    .error p {
      color: var(--muted);
    }
    .error-nav {
      margin-top: 24px;
    }
    .error-nav a {
      color: var(--accent);
      text-decoration: none;
    }
    .error-nav a:hover {
      text-decoration: underline;
    }
    .login-prompt {
      text-align: center;
      padding: 24px 32px;
      background: var(--hover);
      border-top: 1px solid var(--border);
    }
    .login-prompt p {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 12px;
    }
    .login-prompt a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: var(--accent);
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      transition: background 0.2s;
    }
    .login-prompt a:hover {
      background: var(--accent-light);
    }
  </style>
</head>
<body>
  <div class="page-container">
    <nav class="page-nav">
      <a href="/">
        <span>←</span> Home
      </a>
      <a href="#" id="wallLink">
        <span>👤</span> <span id="wallUser"></span>'s wall
      </a>
    </nav>

    <div id="pageContent">
      <div class="loading">Loading...</div>
    </div>
  </div>

  <script type="module">
    import { BlockNoteEditor } from "https://esm.sh/@blocknote/core@0.51.3?bundle";

    const username = {{ username | tojson }};
    const pageId = {{ page_id | tojson }};

    document.getElementById('wallLink').href = `/wall/${username}`;
    document.getElementById('wallUser').textContent = username;
    document.title = 'Loading... — NotionLess Cloud';

    async function loadPage() {
      try {
        const res = await fetch(`/api/users/${username}/pages/${pageId}`);
        if (!res.ok) throw new Error('Page not found');
        const page = await res.json();

        document.title = `${page.title || 'Untitled'} — NotionLess Cloud`;
        const displayName = page.author ? page.author.charAt(0).toUpperCase() + page.author.slice(1) : username;
        const avatar = displayName.charAt(0).toUpperCase();
        const date = page.updated_at ? new Date(page.updated_at * 1000).toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' }) : '';

        let content = '';
        try {
          const blocks = JSON.parse(page.content || '[]');
          if (blocks.length) {
            const editor = BlockNoteEditor.create({ initialContent: blocks });
            content = '<div id="publicEditor"></div>';
            document.getElementById('pageContent').innerHTML = `
              <article class="page-card">
                <header class="page-header">
                  <div class="page-author">
                    <div class="page-author-avatar">${avatar}</div>
                    <div class="page-author-info">
                      <a href="/wall/${username}">${escapeHtml(displayName)}</a>
                      ${date ? `<div class="date">${date}</div>` : ''}
                    </div>
                  </div>
                  <h1 class="page-title">${escapeHtml(page.title || 'Untitled')}</h1>
                </header>
                <div class="page-content">${content}</div>
                <div class="page-actions">
                  <button class="copy-btn" id="copyBtn">
                    📋 Copy to my profile
                  </button>
                  <span class="copy-success" id="copySuccess" style="display:none;">Copied!</span>
                </div>
                <div class="login-prompt" id="loginPrompt" style="display:none;">
                  <p>Log in to copy this page to your profile</p>
                  <a href="/auth/login">Log in</a>
                </div>
              </article>
            `;
            editor.mount(document.getElementById('publicEditor'));
            document.getElementById('publicEditor').querySelector('.bn-editor').style.minHeight = '200px';

            document.getElementById('copyBtn').addEventListener('click', () => copyPage());
          } else {
            throw new Error('No content');
          }
        } catch (e) {
          document.getElementById('pageContent').innerHTML = `
            <article class="page-card">
              <header class="page-header">
                <div class="page-author">
                  <div class="page-author-avatar">${avatar}</div>
                  <div class="page-author-info">
                    <a href="/wall/${username}">${escapeHtml(displayName)}</a>
                    ${date ? `<div class="date">${date}</div>` : ''}
                  </div>
                </div>
                <h1 class="page-title">${escapeHtml(page.title || 'Untitled')}</h1>
              </header>
              <div class="page-content">
                <p style="color:var(--muted);">This page appears to be empty.</p>
              </div>
              <div class="page-actions">
                <button class="copy-btn" id="copyBtn">
                  📋 Copy to my profile
                </button>
                <span class="copy-success" id="copySuccess" style="display:none;">Copied!</span>
              </div>
              <div class="login-prompt" id="loginPrompt" style="display:none;">
                <p>Log in to copy this page to your profile</p>
                <a href="/auth/login">Log in</a>
              </div>
            </article>
          `;
          document.getElementById('copyBtn').addEventListener('click', () => copyPage());
        }

        checkLoginAndSetupCopy();
      } catch (err) {
        document.getElementById('pageContent').innerHTML = `
          <div class="error">
            <h2>Page not found</h2>
            <p>This page doesn't exist or has been made private.</p>
            <div class="error-nav">
              <a href="/wall/${username}">← Back to ${username}'s wall</a>
            </div>
          </div>
        `;
      }
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    async function copyPage() {
      const btn = document.getElementById('copyBtn');
      const success = document.getElementById('copySuccess');
      btn.disabled = true;
      btn.textContent = 'Copying...';
      try {
        const res = await fetch(`/api/pages/${pageId}/copy`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ source_username: username })
        });
        if (!res.ok) {
          if (res.status === 401) {
            document.getElementById('loginPrompt').style.display = 'block';
            btn.style.display = 'none';
            return;
          }
          throw new Error('Copy failed');
        }
        btn.style.display = 'none';
        success.style.display = 'inline';
        setTimeout(() => { success.textContent = 'Page copied! Go to your workspace to view it.'; }, 1500);
      } catch (err) {
        btn.disabled = false;
        btn.textContent = '📋 Copy to my profile';
        alert('Failed to copy page. Please try again.');
      }
    }

    async function checkLoginAndSetupCopy() {
      try {
        const res = await fetch('/api/me');
        if (res.ok) {
          const data = await res.json();
          if (data.username === username) {
            document.getElementById('copyBtn').style.display = 'none';
          }
        }
      } catch (e) {}
    }

    loadPage();
  </script>
</body>
</html>
