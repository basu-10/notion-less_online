<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#d85b45">
  <title>Loading... — NotionLess Cloud</title>
  <link rel="preconnect" href="https://esm.sh">
  <link rel="stylesheet" href="https://esm.sh/@blocknote/core@0.51.3/style.css">
  <link rel="stylesheet" href="https://esm.sh/@blocknote/core@0.51.3/fonts/inter.css">
  <link rel="stylesheet" href="/static/css/theme.css">
  <link rel="stylesheet" href="/static/css/auth.css">
  <script>
    (function() {
      var t;
      try { t = localStorage.getItem("notion-theme"); } catch(e) {}
      var theme = (t === "dark" || t === "light") ? t : (
        window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
      );
      if (theme === "dark") { document.documentElement.setAttribute("data-theme", "dark"); }
    })();
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #fafaf8;
      --surface: #ffffff;
      --border: #e8e5df;
      --text: #1a1a18;
      --muted: #8a8780;
      --hover: #f0efed;
      --accent: #d85b45;
      --accent-light: #e87a6a;
    }
    [data-theme="dark"] {
      --bg: #18181b;
      --surface: #1c1c21;
      --border: #2a2a2f;
      --text: #e8e8ef;
      --muted: #a7a7a3;
      --hover: #2a2a30;
    }
    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      overflow-y: auto;
      overflow-x: hidden;
    }
    .page-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 60px 24px 48px;
    }
    .page-nav {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 32px;
    }
    .page-nav a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.2s;
    }
    .page-nav a:hover {
      color: var(--accent);
    }
    .hero {
      position: relative;
      margin-bottom: 40px;
      border-radius: 16px;
      overflow: hidden;
    }
    .hero-cover {
      height: 160px;
      background: linear-gradient(135deg, var(--accent) 0%, #e87a6a 60%, #f4e4c0 100%);
      position: relative;
    }
    .hero-cover::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 30% 40%, rgba(255,255,255,0.25) 0%, transparent 60%);
    }
    .hero-body {
      display: flex;
      align-items: flex-end;
      gap: 24px;
      padding: 0 32px 28px;
      margin-top: -60px;
      position: relative;
      z-index: 2;
    }
    .hero-avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 4px solid var(--surface);
      box-shadow: 0 12px 40px rgba(216,91,69,0.35), 0 4px 16px rgba(0,0,0,0.08);
      object-fit: cover;
      flex-shrink: 0;
      background: linear-gradient(135deg, var(--accent), var(--accent-light));
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .hero-avatar:hover { transform: scale(1.03); box-shadow: 0 16px 50px rgba(216,91,69,0.45); }
    .hero-author-block { flex: 1; min-width: 0; }
    .hero-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 12px; border-radius: 20px; border: 1.5px solid var(--accent);
      color: var(--accent); font-size: 0.7rem; font-weight: 800; letter-spacing: 0.1em;
      text-transform: uppercase; margin-bottom: 12px; background: rgba(216,91,69,0.06);
    }
    .hero-author-name {
      font-size: 1.6rem; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; margin: 0 0 6px;
    }
    .hero-author-name a { color: inherit; text-decoration: none; }
    .hero-author-name a:hover { color: var(--accent); }
    .hero-bio {
      color: var(--muted); font-size: 0.95rem; max-width: 440px; line-height: 1.5; margin: 0;
    }
    .hero-cta {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 18px; border-radius: 22px; border: 1.5px solid var(--accent);
      color: var(--accent); text-decoration: none; font-size: 0.85rem; font-weight: 700;
      transition: background 0.2s ease, color 0.2s ease;
      margin-top: 10px;
    }
    .hero-cta:hover { background: var(--accent); color: white; }
    .page-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: visible;
    }
    .page-header {
      padding: 32px 32px 24px;
      border-bottom: 1px solid var(--border);
    }
    .page-author {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .page-author-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-light));
      display: grid;
      place-items: center;
      font-size: 14px;
      font-weight: 700;
      color: white;
    }
    .page-author-info {
      font-size: 0.9rem;
    }
    .page-author-info a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    .page-author-info a:hover {
      text-decoration: underline;
    }
    .page-author-info .date {
      color: var(--muted);
      font-size: 0.8rem;
    }
    .page-title {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0;
    }
    .page-content {
      padding: 32px;
    }
    .page-content .bn-editor {
      min-height: 200px;
    }
    .page-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 20px 32px;
      border-top: 1px solid var(--border);
      background: var(--hover);
    }
    .copy-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .copy-btn:hover {
      background: var(--accent-light);
      transform: translateY(-1px);
    }
    .copy-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .copy-success {
      color: var(--accent);
      font-size: 0.9rem;
      font-weight: 500;
    }
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px;
      color: var(--muted);
    }
    .error {
      text-align: center;
      padding: 48px;
    }
    .error h2 {
      color: var(--accent);
      margin-bottom: 8px;
    }
    .error p {
      color: var(--muted);
    }
    .error-nav {
      margin-top: 24px;
    }
    .error-nav a {
      color: var(--accent);
      text-decoration: none;
    }
    .error-nav a:hover {
      text-decoration: underline;
    }
    .page-subpages {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }
    .page-subpages h3 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 14px;
      font-weight: 600;
    }
    .subpage-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .subpage-item {
      margin-bottom: 6px;
    }
    .subpage-item a {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 10px; border-radius: 8px;
      text-decoration: none; color: var(--text);
      font-size: 0.9rem; font-weight: 500;
      transition: background .15s ease, color .15s ease;
    }
    .subpage-item a:hover { background: var(--hover); color: var(--text); }
    .subpage-icon { font-size: 14px; opacity: 0.6; }
    .subpage-empty { color: var(--muted); font-size: 0.85rem; }
    .article-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; padding: 0 32px 28px; }
    .article-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px; text-decoration: none; color: inherit; transition: all 0.2s ease; }
    .article-card:hover { border-color: var(--accent); box-shadow: 0 6px 20px rgba(216,91,69,0.1); transform: translateY(-2px); }
    .article-card h4 { font-size: 0.95rem; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 8px; line-height: 1.2; }
    .article-card .meta { font-size: 0.75rem; color: var(--muted); }
    .nested-indent { padding-left: 18px; }
    .login-prompt {
      text-align: center;
      padding: 24px 32px;
      background: var(--hover);
      border-top: 1px solid var(--border);
    }
    .login-prompt p {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 12px;
    }
    .login-prompt a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: var(--accent);
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      transition: background 0.2s;
    }
    .login-prompt a:hover {
      background: var(--accent-light);
    }
  </style>
</head>
<body>
  <div class="page-container">
    <nav class="page-nav">
      <a href="/">
        <span>←</span> Home
      </a>
      <a href="#" id="wallLink">
        <span>👤</span> <span id="wallUser"></span>'s wall
      </a>
    </nav>

    <div id="pageContent">
      <div class="loading">Loading...</div>
    </div>
  </div>

  <script type="module">
    import { BlockNoteEditor } from "https://esm.sh/@blocknote/core@0.51.3?bundle";

    const username = {{ username | tojson }};
    const pageId = {{ page_id | tojson }};

    document.getElementById('wallLink').href = `/wall/${username}`;
    document.getElementById('wallUser').textContent = username;
    document.title = 'Loading... — NotionLess Cloud';

    async function loadPage() {
      try {
        const res = await fetch(`/api/users/${username}/pages/${pageId}`);
        if (!res.ok) throw new Error('Page not found');
        const page = await res.json();

        document.title = `${page.title || 'Untitled'} — NotionLess Cloud`;
        const profileData = page.author_profile || {};
        const avatarUrl = profileData.avatar_url || '';
        const displayName = page.author ? page.author.charAt(0).toUpperCase() + page.author.slice(1) : username;
        const avatar = displayName.charAt(0).toUpperCase();
        const date = page.updated_at ? new Date(page.updated_at * 1000).toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' }) : '';

        let content = '<div id="publicEditor"></div>';
        let editor = null;
        let editorEl = null;
        let contentRendered = false;
        try {
          const rawContent = page.content || '[]';
          const blocks = (typeof rawContent === 'string') ? JSON.parse(rawContent) : (Array.isArray(rawContent) ? rawContent : []);
          if (blocks && Array.isArray(blocks) && blocks.length > 0) {
            editor = BlockNoteEditor.create({ initialContent: blocks });
            content = '<div id="publicEditor"></div>';
            contentRendered = true;
          } else {
            // Even if blocks appear empty, render editor with default empty paragraph so page never looks broken
            editor = BlockNoteEditor.create({ initialContent: [{ type: 'paragraph', content: '' }] });
            content = '<div id="publicEditor"></div>';
            contentRendered = true;
          }
        } catch (e) {
          // Fallback for malformed content: show empty editor rather than error message
          editor = BlockNoteEditor.create({ initialContent: [{ type: 'paragraph', content: '' }] });
          content = '<div id="publicEditor"></div>';
          contentRendered = true;
        }

        const subpagesHtml = (page.subpages && page.subpages.length > 0) ? `
          <div class="page-subpages">
            <h3>Subpages</h3>
            <ul class="subpage-list">
              ${page.subpages.map(sp => `
                <li class="subpage-item">
                  <a href="/p/${username}/${sp.id}">
                    <span class="subpage-icon">📄</span>
                    <span>${escapeHtml(sp.title || 'Untitled')}</span>
                  </a>
                </li>
              `).join('')}
            </ul>
          </div>
        ` : '';

        document.getElementById('pageContent').innerHTML = `
          <article class="page-card">
            <header class="hero">
              <div class="hero-cover"></div>
              <div class="hero-body">
                <img src="${escapeHtml(avatarUrl)}" class="hero-avatar" alt="${escapeHtml(displayName)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';this.nextElementSibling.innerHTML='<span style=font-size:2rem;color:#fff;font-weight:800;text-align:center;width:100%;line-height:120px;>${avatar}</span>';">
                <div class="hero-avatar" style="display:none;">${avatar}</div>
                <div class="hero-author-block">
                  <div class="hero-badge">Public</div>
                  <h2 class="hero-author-name"><a href="/wall/${username}">${escapeHtml(displayName)}</a></h2>
                  <p class="hero-bio">${escapeHtml(page.author_profile ? (page.author_profile.bio || '') : '')}</p>
                  <a href="/wall/${username}" class="hero-cta">View profile →</a>
                </div>
              </div>
            </header>

            <div style="padding: 32px 32px 0;">
              <p style="color: var(--muted); font-size: 0.85rem; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; margin-bottom: 6px;">From the blog of <a href="/wall/${username}" style="color: var(--accent); text-decoration: none;">${escapeHtml(username)}</a></p>
              <h1 class="page-title" style="font-size: 2.4rem; letter-spacing: -0.035em; line-height: 1.1; margin-bottom: 8px;">${escapeHtml(page.title || 'Untitled')}</h1>
              <div class="page-author-info" style="margin-bottom: 24px; color: var(--muted); font-size: 0.85rem;">
                Updated ${date ? date : 'recently'} · ${page.subpages ? page.subpages.length : 0} subpage${page.subpages && page.subpages.length === 1 ? '' : 's'}
              </div>
            </div>

            ${(page.other_articles && page.other_articles.length > 0) ? `
              <div class="article-cards" style="padding: 0 32px 24px;">
                <h3 style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; margin-bottom: 14px;">Other articles from this blog</h3>
                ${page.other_articles.map(art => `
                  <a href="/p/${username}/${art.id}" class="article-card">
                    <h4>${escapeHtml(art.title || 'Untitled')}</h4>
                    <span class="meta">Updated ${art.updated_at ? new Date(art.updated_at * 1000).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) : 'recently'}</span>
                  </a>
                `).join('')}
              </div>
            ` : ''}

            <div class="page-content" style="padding-top: 8px;">${content}</div>
            ${subpagesHtml}
            <div class="page-actions">
              <button class="copy-btn" id="copyBtn">
                📋 Copy to my profile
              </button>
              <span class="copy-success" id="copySuccess" style="display:none;">Copied!</span>
            </div>
            <div class="login-prompt" id="loginPrompt" style="display:none;">
              <p>Log in to copy this page to your profile</p>
              <a href="/auth/login">Log in</a>
            </div>
          </article>
        `;

        if (editor && document.getElementById('publicEditor')) {
          editor.mount(document.getElementById('publicEditor'));
          const editorContainer = document.getElementById('publicEditor').querySelector('.bn-editor');
          if (editorContainer) editorContainer.style.minHeight = '200px';
        }
        document.getElementById('copyBtn').addEventListener('click', () => copyPage());

        checkLoginAndSetupCopy();
      } catch (err) {
        document.getElementById('pageContent').innerHTML = `
          <div class="error">
            <h2>Page not found</h2>
            <p>This page doesn't exist or has been made private.</p>
            <div class="error-nav">
              <a href="/wall/${username}">← Back to ${username}'s wall</a>
            </div>
          </div>
        `;
      }
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    async function copyPage() {
      const btn = document.getElementById('copyBtn');
      const success = document.getElementById('copySuccess');
      btn.disabled = true;
      btn.textContent = 'Copying...';
      try {
        const res = await fetch(`/api/pages/${pageId}/copy`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ source_username: username })
        });
        if (!res.ok) {
          if (res.status === 401) {
            document.getElementById('loginPrompt').style.display = 'block';
            btn.style.display = 'none';
            return;
          }
          throw new Error('Copy failed');
        }
        btn.style.display = 'none';
        success.style.display = 'inline';
        setTimeout(() => { success.textContent = 'Page copied! Go to your workspace to view it.'; }, 1500);
      } catch (err) {
        btn.disabled = false;
        btn.textContent = '📋 Copy to my profile';
        alert('Failed to copy page. Please try again.');
      }
    }

    async function checkLoginAndSetupCopy() {
      try {
        const res = await fetch('/api/me');
        if (res.ok) {
          const data = await res.json();
          if (data.username === username) {
            document.getElementById('copyBtn').style.display = 'none';
          }
        }
      } catch (e) {}
    }

    loadPage();
  </script>
</body>
</html>
