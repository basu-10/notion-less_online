<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#d85b45">
  <title>Not Found — NotionLess Cloud</title>
  <link rel="stylesheet" href="/static/css/theme.css">
  <script>
    (function() {
      var t;
      try { t = localStorage.getItem("notion-theme"); } catch(e) {}
      var theme = (t === "dark" || t === "light") ? t : (
        window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
      );
      if (theme === "dark") { document.documentElement.setAttribute("data-theme", "dark"); }
    })();
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #fafaf8;
      --surface: #ffffff;
      --border: #e8e5df;
      --text: #1a1a18;
      --muted: #8a8780;
      --accent: #d85b45;
    }
    [data-theme="dark"] {
      --bg: #18181b;
      --surface: #1c1c21;
      --border: #2a2a2f;
      --text: #e8e8ef;
      --muted: #a7a7a3;
    }
    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .error-container {
      text-align: center;
      padding: 48px 24px;
    }
    .error-code {
      font-size: 6rem;
      font-weight: 700;
      color: var(--border);
      line-height: 1;
      margin-bottom: 24px;
    }
    .error-message {
      font-size: 1.25rem;
      color: var(--text);
      margin-bottom: 8px;
    }
    .error-detail {
      color: var(--muted);
      margin-bottom: 32px;
    }
    .error-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 12px 24px;
      background: var(--accent);
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: opacity 0.2s;
    }
    .error-link:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="error-code">404</div>
    <h1 class="error-message">{{ message or 'Page not found' }}</h1>
    <p class="error-detail">The page you're looking for doesn't exist or has been moved.</p>
    <a href="/" class="error-link">← Go home</a>
  </div>
</body>
</html>
