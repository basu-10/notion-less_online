<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — NotionLess Cloud</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/css/theme.css">
  <link rel="stylesheet" href="/static/css/auth.css">
  <script src="/static/js/theme.js"></script>
  <script>
    // Bootstrap theme before first paint. Default is light; only stored
    // prefs (or explicit "auto") may switch to dark.
    (function() {
      var t = null;
      try { t = localStorage.getItem("notion-theme"); } catch(e) {}
      if (t === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
      } else if (t === "auto") {
        document.documentElement.setAttribute("data-theme", "auto");
        if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      } else {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>
  <style>
    body { background: var(--bg); color: var(--text); }
    .auth-container { background: transparent; }
    .auth-card { background: var(--panel); border-color: var(--border); }
    .auth-card h2 { color: var(--text); }
    .auth-card input { background: var(--bg); border-color: var(--border); color: var(--text); }
    .auth-card input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .auth-card p { color: var(--muted); }
  </style>
</head>
<body>
  <div class="theme-toggle-wrapper" aria-label="Theme toggle">
    <button class="theme-toggle" id="themeToggleBtn" aria-label="Toggle theme" aria-expanded="false" aria-haspopup="true">
      <svg id="themeIconLight" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      <svg id="themeIconDark" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg id="themeIconAuto" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
      <span id="themeLabel">Light</span>
    </button>
    <div class="theme-toggle-menu" id="themeMenu" role="menu" aria-label="Theme options" aria-hidden="true">
      <button class="theme-btn active" data-theme="light" role="menuitemradio" aria-checked="true" aria-label="Light theme">Light</button>
      <button class="theme-btn" data-theme="dark" role="menuitemradio" aria-checked="false" aria-label="Dark theme">Dark</button>
      <button class="theme-btn" data-theme="auto" role="menuitemradio" aria-checked="false" aria-label="Auto theme">Follow system</button>
    </div>
  </div>

  <div class="auth-container">
    <article class="auth-card" aria-label="Login form">
      <h1>NotionLess Cloud</h1>
      <h2>Welcome back</h2>
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="error" role="alert" aria-live="assertive">{{ messages[0] }}</div>
        {% endif %}
      {% endwith %}
      <form method="POST" aria-label="Login form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="field-wrap has-0">
          <input type="text" name="username" id="loginUsername" placeholder="Username" required autocomplete="username" aria-label="Username" aria-required="true">
        </div>
        <div class="field-wrap has-1">
          <input type="password" name="password" id="loginPassword" placeholder="Password" required autocomplete="current-password" aria-label="Password" aria-required="true">
          <div class="field-actions">
            <button type="button" class="field-btn" id="loginPwToggle" title="Show password" aria-label="Show password" aria-pressed="false">
              <svg class="icon-eye" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="icon-eye-off" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>
        <button type="submit" aria-label="Sign in">Sign in</button>
      </form>
      <p>No account? <a href="/auth/register">Create one</a></p>
    </article>
  </div>

  <script>
    // Theme menu wiring. theme.js is loaded synchronously above, but guard
    // anyway so a theme failure can never kill the password toggle below.
    (function() {
      try {
        var themeBtn = document.getElementById('themeToggleBtn');
        var themeMenu = document.getElementById('themeMenu');
        var themeLabel = document.getElementById('themeLabel');
        var themeIcons = { light: document.getElementById('themeIconLight'), dark: document.getElementById('themeIconDark'), auto: document.getElementById('themeIconAuto') };

        function currentMode() {
          try {
            if (typeof getTheme === 'function') return getTheme();
            return localStorage.getItem('notion-theme') || 'light';
          } catch (e) { return 'light'; }
        }

        function applyMode(mode) {
          try {
            if (typeof applyTheme === 'function') { applyTheme(mode); return; }
          } catch (e) {}
          try {
            document.documentElement.setAttribute('data-theme', mode === 'auto' ? 'auto' : mode);
            localStorage.setItem('notion-theme', mode);
          } catch (e) {}
        }

        function updateThemeUI(mode) {
          Object.values(themeIcons).forEach(function(i) { if (i) i.style.display = 'none'; });
          if (themeIcons[mode]) themeIcons[mode].style.display = 'block';
          if (themeLabel) themeLabel.textContent = mode === 'light' ? 'Light' : mode === 'dark' ? 'Dark' : 'Auto';
        }

        if (themeBtn && themeMenu) {
          themeBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            var open = themeMenu.classList.contains('open');
            themeMenu.classList.toggle('open');
            themeBtn.setAttribute('aria-expanded', String(!open));
          });

          document.addEventListener('click', function() {
            themeMenu.classList.remove('open');
            themeBtn.setAttribute('aria-expanded', 'false');
          });
        }

        document.querySelectorAll('.theme-toggle-menu .theme-btn').forEach(function(b) {
          b.addEventListener('click', function() {
            var mode = b.dataset.theme;
            applyMode(mode);
            document.querySelectorAll('.theme-btn').forEach(function(x) { x.classList.toggle('active', x.dataset.theme === mode); });
            updateThemeUI(mode);
            if (themeMenu) themeMenu.classList.remove('open');
            if (themeBtn) themeBtn.setAttribute('aria-expanded', 'false');
          });
        });

        updateThemeUI(currentMode());
      } catch (e) {}
    })();
  </script>
  <script>
    // Show / hide password (inside the field)
    (function() {
      var toggle = document.getElementById('loginPwToggle');
      var input = document.getElementById('loginPassword');
      if (!toggle || !input) return;
      var eye = toggle.querySelector('.icon-eye');
      var eyeOff = toggle.querySelector('.icon-eye-off');
      toggle.addEventListener('click', function() {
        var show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        toggle.setAttribute('aria-pressed', String(show));
        toggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
        toggle.title = show ? 'Hide password' : 'Show password';
        if (eye) eye.style.display = show ? 'none' : 'block';
        if (eyeOff) eyeOff.style.display = show ? 'block' : 'none';
        input.focus({ preventScroll: true });
      });
    })();
  </script>
</body>
</html>
